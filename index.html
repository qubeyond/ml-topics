<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ML Topics</title>
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ML Topics">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%225%22%20fill%3D%22%230f0f10%22/%3E%3Cpath%20d%3D%22M7%204h10l3.2%205L12%2020.5%203.8%209Z%22%20fill%3D%22none%22%20stroke%3D%22%23f5f5f5%22%20stroke-width%3D%221.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M9.5%204%207.8%209l4.2%2011.5L16.2%209%2014.5%204%22%20fill%3D%22none%22%20stroke%3D%22%23f5f5f5%22%20stroke-width%3D%221.2%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M3.8%209h16.4%22%20stroke%3D%22%23f5f5f5%22%20stroke-width%3D%221.2%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --fg:#111111;
    --muted:#6b6b6b;
    --faint:#9a9a9a;
    --border:#e7e7e7;
    --card-bg:#ffffff;
    --shadow-1:0 1px 2px rgba(0,0,0,.04), 0 1px 6px rgba(0,0,0,.05);
    --shadow-2:0 10px 30px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.06);
    --accent:#111111;
    --track:#eeeeee;
    --research:#7c6fd6;
    --research-track:#efedfb;
    --practice:#c17d2e;
    --practice-track:#faf0e2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0b0c;
      --fg:#f3f3f3;
      --muted:#a3a3a3;
      --faint:#6f6f6f;
      --border:#232323;
      --card-bg:#131314;
      --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 1px 6px rgba(0,0,0,.3);
      --shadow-2:0 10px 30px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
      --accent:#f3f3f3;
      --track:#232323;
      --research:#a99ee8;
      --research-track:#221f34;
      --practice:#e0ac66;
      --practice-track:#332a1a;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  /* реальный скролл живёт здесь, а не в html/body — иначе на мобильных
     схлопывание/раскрытие адрес-бара браузера двигает position:fixed
     элементы (шапка-футер, кнопка настроек) во время скролла */
  #scrollArea{
    position:fixed;inset:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
  }
  a{color:inherit;text-decoration:none;}
  a:visited{color:inherit;}
  a, button, .item, .card{-webkit-tap-highlight-color:transparent;}
  .wrap{
    max-width:760px;margin:0 auto;padding:48px 24px 96px;
    padding-left:max(24px, env(safe-area-inset-left));
    padding-right:max(24px, env(safe-area-inset-right));
    padding-bottom:max(96px, calc(96px + env(safe-area-inset-bottom)));
  }
  /* фикс-футер/настройки сверху занимают свою полосу — отодвигаем заголовок,
     чтобы не липло */
  @media (max-width:640px){
    .wrap{padding-top:max(76px, calc(76px + env(safe-area-inset-top)));}
    /* на страницах курса футер/настройки скрыты — им не нужен большой
       отступ сверху, поднимаем контент выше */
    body:not(.is-home) .wrap{padding-top:max(24px, calc(24px + env(safe-area-inset-top)));}
  }

  /* ---------- header ---------- */
  header.top{text-align:center;margin-bottom:36px;}
  header.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;}

  /* ---------- home grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
  @media (max-width:640px){
    .grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:420px){
    .grid{grid-template-columns:1fr;}
  }
  /* на мобильных сверху уже футер (слева) и settingsBtn (справа) — даём
     сетке карточек небольшой отступ, чтобы не жалась к ним вплотную */
  @media (max-width:640px){
    .grid{margin-top:20px;}
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 18px 16px;
    box-shadow:var(--shadow-1);
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    height:150px;
  }
  @media (max-width:640px){
    .card{height:118px;padding:15px 15px 13px;}
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-4px);
    box-shadow:var(--shadow-2);
    border-color:transparent;
    outline:none;
  }
  .card h2{
    font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:7px;}
  .card .meta .pct{font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg);}
  .card .counts{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .count-research{color:var(--research);font-variant-numeric:tabular-nums;}
  .count-practice{color:var(--practice);font-variant-numeric:tabular-nums;}
  .bar{height:4px;border-radius:999px;background:var(--track);overflow:hidden;}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease;}
  .card .bar-group{display:flex;gap:3px;}
  .card .bar-group .bar{min-width:3px;}
  .card .bar-group .bar-bonus{background:var(--research-track);}
  .card .bar-group .bar-bonus > i{background:var(--research);}
  .card .bar-group .bar-practice{background:var(--practice-track);}
  .card .bar-group .bar-practice > i{background:var(--practice);}

  /* ---------- домены на главной ---------- */
  .domain-heading{
    font-size:12px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);font-weight:700;
    margin:32px 0 14px;
  }
  .domain-heading:first-child{margin-top:0;}

  /* ---------- floating nav buttons ---------- */
  .fab{
    position:fixed;
    width:42px;height:42px;
    border-radius:50%;
    background:var(--card-bg);
    border:1px solid var(--border);
    box-shadow:var(--shadow-1);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--fg);
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    z-index:50;
    /* форсируем отдельный композитный слой — иначе на iOS Safari фикс-элементы
       могут "плавать"/дёргаться во время инерционного скролла */
    transform:translateZ(0);
    -webkit-backface-visibility:hidden;
  }
  .fab:hover{transform:translateY(-2px) translateZ(0);box-shadow:var(--shadow-2);}
  .fab svg{width:18px;height:18px;flex-shrink:0;}
  /* держим кнопки у краёв контент-блока (760px, центрирован), но не даём им уехать за экран */
  /* 380px = половина ширины .wrap (760px), 42px = ширина кнопки, 16px = зазор до контента */
  #topBtn{ right:max(16px, calc(50vw - 380px - 42px - 16px + env(safe-area-inset-right))); bottom:max(28px, calc(28px + env(safe-area-inset-bottom))); opacity:0; pointer-events:none; }
  #topBtn.visible{opacity:1;pointer-events:auto;}
  #backBtn{ left:max(16px, calc(50vw - 380px - 42px - 16px + env(safe-area-inset-left))); top:max(28px, calc(28px + env(safe-area-inset-top))); display:none; }
  /* settingsBtn — та же круглая .fab, только справа; видна лишь на главном экране (см. route()) */
  #settingsBtn{ right:max(16px, calc(50vw - 380px - 42px - 16px + env(safe-area-inset-right))); top:max(28px, calc(28px + env(safe-area-inset-top))); }
  /* ниже 900px кнопка "назад" по горизонтали упирается в заголовок/шапку — уводим вниз */
  @media (max-width:900px){
    #backBtn{top:max(92px, calc(92px + env(safe-area-inset-top)));}
  }
  /* на мобильных экранах у браузера есть свой back — наша кнопка только мешает и налезает на карточки */
  @media (max-width:640px){
    #backBtn{display:none !important;}
  }

  .site-footer{
    position:fixed;
    left:max(20px, calc(20px + env(safe-area-inset-left)));
    bottom:max(20px, calc(20px + env(safe-area-inset-bottom)));
    font-size:11.5px;
    color:var(--faint);
    z-index:40;
    display:flex;align-items:center;gap:7px;
    transform:translateZ(0);
    -webkit-backface-visibility:hidden;
  }
  .site-footer a{transition:color .15s ease;}
  .site-footer a:hover{color:var(--fg);}
  /* на мобильных переносим футер наверх по центру и показываем только на главной */
  @media (max-width:640px){
    .site-footer{
      left:50%;
      right:auto;
      transform:translateX(-50%) translateZ(0);
      top:max(28px, calc(28px + env(safe-area-inset-top)));
      bottom:auto;
    }
    body:not(.is-home) .site-footer{display:none;}
  }

  /* ---------- settings modal (язык + синк) ---------- */
  .modal.settings-modal{max-width:460px;text-align:left;padding:26px;}
  .sync-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;}
  .sync-head h3{font-size:17px;margin:0;letter-spacing:-.01em;}
  .sync-head .icon-btn{width:32px;height:32px;min-width:32px;min-height:32px;flex:none;flex-shrink:0;border-radius:50%;padding:0;}
  .sync-head .icon-btn svg{width:15px;height:15px;display:block;flex-shrink:0;}
  .settings-section{margin-bottom:20px;}
  .settings-section:last-child{margin-bottom:0;}
  .settings-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:10px;}
  .settings-divider{height:1px;background:var(--border);margin:20px 0;}
  .lang-toggle{display:flex;gap:8px;}
  .lang-opt{
    flex:1;font-family:inherit;font-size:13px;font-weight:700;
    padding:9px 0;border-radius:10px;border:1px solid var(--border);
    background:none;color:var(--muted);cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .lang-opt.active{background:var(--accent);border-color:var(--accent);color:var(--bg);}
  .lang-opt:not(.active):hover{border-color:var(--fg);color:var(--fg);}
  .modal.settings-modal p{margin:0 0 12px;font-size:12.5px;line-height:1.55;color:var(--muted);text-align:left;}
  .settings-modal a{text-decoration:underline;text-decoration-color:var(--muted);color:var(--fg);}
  .sync-token-label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:14px;}
  .sync-token-input{
    display:block;width:100%;margin-top:6px;
    font-family:inherit;font-size:13px;color:var(--fg);
    background:var(--bg);border:1px solid var(--border);border-radius:10px;
    padding:9px 10px;box-sizing:border-box;
  }
  .sync-token-input:focus{outline:none;border-color:var(--muted);}
  .sync-connected-as{color:var(--fg);font-weight:600;font-size:13px;}
  .sync-error{color:var(--fg);background:var(--track);border-radius:10px;padding:8px 10px;}
  .settings-modal .modal-actions{justify-content:space-between;}
  .settings-modal .modal-actions button{padding:13px 18px;font-size:14px;}
  .settings-modal .btn-confirm[disabled], .settings-modal .btn-cancel[disabled]{opacity:.5;cursor:default;}

  /* ---------- detail page ---------- */
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:8px;flex-wrap:wrap;}
  .detail-head h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em;}
  .detail-progress{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;}
  .head-actions{display:flex;gap:8px;}
  .icon-btn{
    width:36px;height:36px;min-width:36px;
    border-radius:50%;
    background:none;
    border:1px solid var(--border);
    color:var(--faint);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .icon-btn:hover{color:var(--fg);border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;flex-shrink:0;}
  .reset-btn:hover{transform:rotate(-40deg);}
  .download-btn:hover{transform:translateY(-2px);}

  /* ---------- confirm modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:200;
    padding:24px;
    animation:fade-in .15s ease;
  }
  @keyframes fade-in{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow-2);
    padding:24px;
    max-width:320px;
    width:100%;
    text-align:center;
  }
  .modal p{margin:0 0 20px;font-size:14px;line-height:1.5;color:var(--fg);}
  .modal .modal-actions{display:flex;gap:10px;justify-content:center;align-items:stretch;}
  .modal .modal-actions button{
    font-family:inherit;font-size:13px;line-height:1.3;
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:opacity .15s ease, border-color .15s ease;
    /* ширина кнопки всегда = доля фиксированной ширины модалки, а не длины
       текста — иначе при переключении RU/EN кнопки "прыгают" по размеру.
       текст при этом переносится, а не обрезается многоточием */
    flex:1;
    min-width:0;
    white-space:normal;
    overflow-wrap:break-word;
  }
  .modal .btn-cancel{background:none;border:1px solid var(--border);color:var(--fg);}
  .modal .btn-cancel:hover{border-color:var(--fg);}
  .modal .btn-confirm{background:var(--accent);border:1px solid var(--accent);color:var(--bg);}
  .modal .btn-confirm:hover{opacity:.85;}
  @media (max-width:640px){
    .modal:not(.settings-modal) .modal-actions button{padding:7px 10px;font-size:12px;}
  }
  .bar-segments{display:flex;gap:4px;height:6px;margin:18px 0 36px;}
  .seg-group{display:flex;gap:2px;min-width:5px;}
  .bar-segments .seg{
    position:relative;height:100%;min-width:4px;
    border-radius:999px;background:var(--track);overflow:hidden;
  }
  .bar-segments .seg > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease;}
  /* бонусные кусочки полосы за research/practice-темы — отдельным цветом от основного */
  .bar-segments .seg.seg-bonus{background:var(--research-track);}
  .bar-segments .seg.seg-bonus > i{background:var(--research);}
  .bar-segments .seg.seg-practice{background:var(--practice-track);}
  .bar-segments .seg.seg-practice > i{background:var(--practice);}

  .part{
    margin-bottom:22px;
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 22px;
    background:var(--card-bg);
    box-shadow:var(--shadow-1);
  }
  .part > h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    font-weight:700;
    margin:0 0 14px;
  }
  .section{margin:18px 0 6px;}
  .section > h3{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--fg);}

  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:7px 2px;
    cursor:pointer;
  }
  .item input[type=checkbox]{
    appearance:none;
    -webkit-appearance:none;
    width:17px;height:17px;
    min-width:17px;
    border:1.5px solid var(--faint);
    border-radius:5px;
    display:grid;
    place-content:center;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .item input[type=checkbox]::before{
    content:"";
    width:9px;height:9px;
    transform:scale(0);
    transition:transform .12s ease;
    box-shadow:inset 1em 1em var(--bg);
    clip-path:polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 45% 62%);
  }
  .item input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);}
  .item input[type=checkbox]:checked::before{transform:scale(1);}
  .item .txt{font-size:14.5px;line-height:1.5;flex:1 1 auto;min-width:0;overflow-wrap:anywhere;}
  .item .code{color:var(--faint);opacity:.65;font-variant-numeric:tabular-nums;margin-right:6px;font-size:9px;}
  .item .done-date{
    margin-left:auto;padding-left:10px;flex-shrink:0;
    font-size:10px;color:var(--faint);white-space:nowrap;
  }
  .item .done-date:empty{display:none;}
  .item.checked .label{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--border);}
  .item a{font-weight:600;text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px;}
  .item a:hover{text-decoration-color:currentColor;}
  .item a::after{content:"↗";display:inline-block;margin-left:2px;font-size:.8em;font-weight:400;transform:translateY(-1px);}

  /* тач-устройства: чекбокс и сама строка пункта побольше, легче попасть пальцем */
  @media (pointer:coarse){
    .item{padding:10px 2px;min-height:26px;}
    .item input[type=checkbox]{width:21px;height:21px;min-width:21px;}
    .icon-btn, .fab{width:44px;height:44px;min-width:44px;}
  }

  /* ресерч-темы (необязательный "углублённый" уровень): выделяем лиловым цветом, без отдельного бейджа */
  .item.research input[type=checkbox]{border-color:var(--research);}
  .item.research input[type=checkbox]:checked{background:var(--research);border-color:var(--research);}
  .item.research .code{color:var(--research);opacity:.85;}
  .item.practice input[type=checkbox]{border-color:var(--practice);}
  .item.practice input[type=checkbox]:checked{background:var(--practice);border-color:var(--practice);}
  .item.practice .code{color:var(--practice);opacity:.85;}
  /* пункт помечен и {r}, и {p} сразу — чекбокс двухцветный (диагональный градиент).
     border-image игнорирует border-radius (стал бы квадратным) — вместо него
     трюк с двумя фоновыми слоями: внутренний padding-box перекрывает заливку,
     внешний border-box просвечивает только в кольце рамки, форма остаётся круглой.
     Код остаётся лиловым (research как основной цвет для текста) */
  .item.research.practice input[type=checkbox]{
    border-color:transparent;
    background:
      linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
      linear-gradient(135deg, var(--research), var(--practice)) border-box;
  }
  .item.research.practice input[type=checkbox]:checked{
    background:linear-gradient(135deg, var(--research), var(--practice));
    border-color:transparent;
  }
  .item.research.practice .code{color:var(--research);opacity:.85;}

  /* ---------- dependency graph ---------- */
  .graph-canvas{position:relative;width:100%;height:100%;overflow:hidden;}
  .graph-canvas svg.graph-edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  .graph-canvas svg.graph-edges line{stroke:var(--border);stroke-width:1.5;transition:stroke .1s ease, stroke-width .1s ease;}
  .graph-canvas svg.graph-edges line.active{stroke:var(--fg);stroke-width:2;}
  .graph-nodes-layer{position:absolute;left:0;top:0;}

  /* мини-превью — точки без подписи, в духе Obsidian */
  .graph-node.graph-dot{position:absolute;border-radius:50%;border:none;background:var(--faint);}
  .graph-node.graph-dot.checked{background:var(--accent);}
  .graph-node.graph-dot.research{background:var(--research-track);}
  .graph-node.graph-dot.research.checked{background:var(--research);}
  .graph-node.graph-dot.practice{background:var(--practice-track);}
  .graph-node.graph-dot.practice.checked{background:var(--practice);}
  .graph-node.graph-dot.research.practice{background:linear-gradient(135deg, var(--research-track), var(--practice-track));}
  .graph-node.graph-dot.research.practice.checked{background:linear-gradient(135deg, var(--research), var(--practice));}
  .graph-mini .graph-edges line{stroke-width:1;}

  /* фулскрин — точка + подпись сверху над ней, не прямоугольник-с-текстом */
  .graph-node-dot{
    position:absolute;border-radius:50%;
    background:var(--card-bg);border:2px solid var(--faint);
    cursor:pointer;user-select:none;touch-action:none;
    box-shadow:var(--shadow-1);
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .graph-node-dot.checked{background:var(--accent);border-color:var(--accent);}
  .graph-node-dot.research{border-color:var(--research);}
  .graph-node-dot.research.checked{background:var(--research);border-color:var(--research);}
  .graph-node-dot.practice{border-color:var(--practice);}
  .graph-node-dot.practice.checked{background:var(--practice);border-color:var(--practice);}
  .graph-node-dot.research.practice{
    border-color:transparent;
    background:
      linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
      linear-gradient(135deg, var(--research), var(--practice)) border-box;
  }
  .graph-node-dot.research.practice.checked{background:linear-gradient(135deg, var(--research), var(--practice));border-color:transparent;}
  .graph-node-dot.dragging{transform:scale(1.4);}
  .graph-node-label{
    position:absolute;
    transform:translate(-50%, -100%);
    font-size:11px;font-weight:600;color:var(--muted);
    white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;user-select:none;touch-action:none;
  }
  .graph-node-label.checked{color:var(--fg);}
  .graph-node-label.research{color:var(--research);}
  .graph-node-label.practice{color:var(--practice);}
  .graph-node-label.research.practice{color:var(--research);}

  /* мини-превью в углу страницы курса — только на широких экранах,
     на мобильных/узких вместо него просто кнопка в head-actions */
  @media (min-width:1280px){
    .graph-mini{
      position:fixed;
      top:28px;
      right:max(16px, calc(50vw - 380px - 260px - 24px));
      width:260px;height:220px;
      border:1px solid var(--border);
      border-radius:16px;
      background:var(--card-bg);
      box-shadow:var(--shadow-1);
      overflow:hidden;
      cursor:grab;
      touch-action:none;
      z-index:45;
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    .graph-mini:hover{border-color:var(--fg);box-shadow:var(--shadow-2);}
  }
  .graph-mini .panning{cursor:grabbing;}
  .graph-mini-label{
    position:absolute;top:8px;left:10px;font-size:10px;text-transform:uppercase;
    letter-spacing:.07em;color:var(--muted);font-weight:700;z-index:2;
    display:flex;align-items:center;gap:5px;pointer-events:none;
  }
  .graph-mini-label svg{width:11px;height:11px;flex-shrink:0;}
  .graph-mini-expand{
    position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--faint);
    background:var(--card-bg);border:none;z-index:2;cursor:pointer;padding:0;
  }
  .graph-mini-expand svg{width:12px;height:12px;flex-shrink:0;}

  /* полноэкранный оверлей графа */
  .graph-overlay-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    z-index:300;display:flex;align-items:center;justify-content:center;
    padding:20px;
    animation:fade-in .15s ease;
  }
  .graph-overlay{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow-2);
    width:100%;height:100%;
    max-width:1400px;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .graph-overlay-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--border);
    flex-shrink:0;gap:12px;
    position:relative;
  }
  .graph-overlay-head h3{margin:0;font-size:15px;}
  .graph-overlay-head-actions{display:flex;gap:8px;flex-shrink:0;}
  .graph-parts-popover{
    position:absolute;top:100%;right:20px;margin-top:6px;
    background:var(--card-bg);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow-2);padding:10px;z-index:5;
    display:flex;flex-direction:column;gap:2px;
    max-height:min(340px, 60vh);overflow-y:auto;
    width:min(280px, 80vw);
  }
  .graph-parts-opt{
    display:flex;align-items:center;gap:8px;
    padding:6px 8px;border-radius:8px;font-size:12.5px;cursor:pointer;
  }
  .graph-parts-opt:hover{background:var(--track);}
  .graph-parts-opt input{flex-shrink:0;}
  /* фон "в точечку", как разлиновка на бумаге для графов — двигается вместе с камерой (JS) */
  .graph-overlay-body{
    flex:1;position:relative;overflow:hidden;cursor:grab;
    background-color:var(--card-bg);
    background-image:radial-gradient(circle, var(--border) 1.2px, transparent 1.2px);
    touch-action:none;
  }
  .graph-overlay-body.panning{cursor:grabbing;}
  @media (max-width:640px){
    .graph-overlay-backdrop{padding:0;}
    .graph-overlay{border-radius:0;max-width:none;}
  }

  .empty{color:var(--muted);padding:40px 0;text-align:center;}
</style>
</head>
<body>
<div id="scrollArea">
  <div class="wrap" id="app"></div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "mltopics:v1";
  var state = {};
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch(e){ state = {}; }

  // Формат записи: {d: done?, t: timestamp последнего изменения}. Раньше тут
  // просто лежал boolean — на лету приводим старые данные к новому виду.
  // "t" — не только "когда прошёл тему", но и ключ для merge при синке.
  function migrateState(obj){
    Object.keys(obj || {}).forEach(function(catId){
      var cat = obj[catId];
      Object.keys(cat || {}).forEach(function(code){
        var v = cat[code];
        if(typeof v === "boolean"){ cat[code] = { d: v, t: 0 }; }
      });
    });
    return obj;
  }
  state = migrateState(state);

  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
    scheduleSyncPush();
  }

  // ---------------------------------------------------------------------
  // language: content lives in content/ru/*.md and content/en/*.md
  // (identical structure/order, so checkbox state carries over 1:1)
  // ---------------------------------------------------------------------
  var LANG_KEY = "mltopics:lang";
  var LANG = "ru";
  try { LANG = localStorage.getItem(LANG_KEY) || "ru"; } catch(e){ LANG = "ru"; }

  var STRINGS = {
    ru: {
      partWord: "Часть",
      back: "К категориям",
      top: "Наверх",
      download: "Скачать .md",
      reset: "Сбросить прогресс",
      cancel: "Отмена",
      confirmBtn: "Сбросить",
      resetConfirm: function(title){ return 'Сбросить прогресс по разделу «' + title + '»?'; },
      notFound: "Категория не найдена.",
      researchHint: "Тема углублённого уровня",
      practiceHint: "Практическое задание",
      completedOn: function(date){ return "Пройдено: " + date; },
      syncing: "Синк…",
      synced: function(login){ return "Синк: " + login; },
      syncOff: "Синк выкл",
      syncTitle: "Синхронизация между устройствами",
      syncIntro: "Прогресс хранится в приватном GitHub Gist — только твой браузер обращается к api.github.com напрямую, никакой другой сервер данные не видит.",
      syncHowTo: "Создай токен на странице ",
      syncHowToLinkText: "github.com/settings/tokens/new",
      syncHowToAfter: " — тип classic, единственный галочка scope: «gist». Ничего больше не отмечай.",
      syncTokenLabel: "Personal access token",
      syncTokenPlaceholder: "ghp_…",
      syncConnectBtn: "Подключить",
      syncDisconnectBtn: "Отключить",
      syncNowBtn: "Обновить",
      syncConnectedAs: function(login){ return "Подключено как " + login; },
      syncLastSync: function(date){ return "Последний синк: " + date; },
      syncNeverSynced: "Ещё не синхронизировалось",
      syncErrorPrefix: "Ошибка синка: ",
      syncClose: "Закрыть",
      settingsTitle: "Настройки",
      langLabel: "Язык",
      syncSectionLabel: "Синхронизация",
      domainMl: "ML",
      domainMath: "Математика",
      graphBtn: "Граф зависимостей",
      graphMiniLabel: "Граф",
      graphEmpty: "Для этого курса граф ещё не размечен.",
      graphPartsBtn: "Показать только выбранные части"
    },
    en: {
      partWord: "Part",
      back: "Back to categories",
      top: "Scroll to top",
      download: "Download .md",
      reset: "Reset progress",
      cancel: "Cancel",
      confirmBtn: "Reset",
      resetConfirm: function(title){ return "Reset progress for “" + title + "”?"; },
      notFound: "Category not found.",
      researchHint: "Deep-dive topic",
      practiceHint: "Hands-on exercise",
      completedOn: function(date){ return "Completed: " + date; },
      syncing: "Syncing…",
      synced: function(login){ return "Sync: " + login; },
      syncOff: "Sync off",
      syncTitle: "Sync across devices",
      syncIntro: "Progress is stored in a private GitHub Gist — only your browser talks to api.github.com directly, no other server ever sees the data.",
      syncHowTo: "Create a token at ",
      syncHowToLinkText: "github.com/settings/tokens/new",
      syncHowToAfter: " — type classic, tick only the “gist” scope. Nothing else.",
      syncTokenLabel: "Personal access token",
      syncTokenPlaceholder: "ghp_…",
      syncConnectBtn: "Connect",
      syncDisconnectBtn: "Disconnect",
      syncNowBtn: "Sync now",
      syncConnectedAs: function(login){ return "Connected as " + login; },
      syncLastSync: function(date){ return "Last synced: " + date; },
      syncNeverSynced: "Not synced yet",
      syncErrorPrefix: "Sync error: ",
      syncClose: "Close",
      settingsTitle: "Settings",
      langLabel: "Language",
      syncSectionLabel: "Sync",
      domainMl: "ML",
      domainMath: "Math",
      graphBtn: "Dependency graph",
      graphMiniLabel: "Graph",
      graphEmpty: "No graph annotated for this course yet.",
      graphPartsBtn: "Show only selected parts"
    }
  };
  function t(){ return STRINGS[LANG]; }

  function isChecked(catId, code, defaultChecked){
    var cat = state[catId];
    if(cat && Object.prototype.hasOwnProperty.call(cat, code)) return !!cat[code].d;
    return !!defaultChecked;
  }

  function checkedAt(catId, code){
    var cat = state[catId];
    var v = cat && cat[code];
    return (v && v.d && v.t) ? v.t : null;
  }

  function setChecked(catId, code, value){
    if(!state[catId]) state[catId] = {};
    state[catId][code] = { d: value, t: Date.now() };
    saveState();
  }

  function resetCategory(catId){
    delete state[catId];
    saveState();
  }

  // ---------------------------------------------------------------------
  // GitHub Gist sync — без бэкенда: личный токен (scope "gist") живёт
  // только в localStorage этого браузера, все запросы идут напрямую с
  // клиента на api.github.com. Наружу (кроме самого GitHub) ничего не
  // уходит. Синк — это pull + merge (по свежести "t" на каждый пункт,
  // last-write-wins) + push.
  // ---------------------------------------------------------------------
  var GH_TOKEN_KEY = "mltopics:gh-token";
  var GH_GIST_ID_KEY = "mltopics:gh-gist-id";
  var GH_LOGIN_KEY = "mltopics:gh-login";
  var GIST_FILENAME = "mltopics-progress.json";
  var SYNC_DEBOUNCE_MS = 2500;

  var sync = {
    connected: false,
    login: null,
    syncing: false,
    error: null,
    lastSyncAt: null,
    onChange: null // UI подписывается сюда, если открыта панель синка
  };

  function ghToken(){ try { return localStorage.getItem(GH_TOKEN_KEY) || ""; } catch(e){ return ""; } }
  function setGhToken(tok){
    try {
      if(tok) localStorage.setItem(GH_TOKEN_KEY, tok);
      else { localStorage.removeItem(GH_TOKEN_KEY); localStorage.removeItem(GH_GIST_ID_KEY); localStorage.removeItem(GH_LOGIN_KEY); }
    } catch(e){}
  }

  function notifySync(){ if(sync.onChange) sync.onChange(); }

  function ghApi(path, opts){
    opts = opts || {};
    var headers = Object.assign({
      "Authorization": "token " + ghToken(),
      "Accept": "application/vnd.github+json"
    }, opts.headers || {});
    return fetch("https://api.github.com" + path, Object.assign({}, opts, { headers: headers }))
      .then(function(r){
        if(!r.ok){
          return r.json().catch(function(){ return null; }).then(function(body){
            var msg = (body && body.message) ? body.message : ("HTTP " + r.status);
            throw new Error(msg);
          });
        }
        return r.status === 204 ? null : r.json();
      });
  }

  function resolveGistId(){
    var cached = null;
    try { cached = localStorage.getItem(GH_GIST_ID_KEY); } catch(e){}
    if(cached) return Promise.resolve(cached);
    return ghApi("/gists?per_page=100").then(function(gists){
      var found = (gists || []).find(function(g){ return g.files && g.files[GIST_FILENAME]; });
      if(found){ try { localStorage.setItem(GH_GIST_ID_KEY, found.id); } catch(e){} return found.id; }
      return null;
    });
  }

  function makeFilesPayload(stateObj){
    var files = {};
    files[GIST_FILENAME] = { content: JSON.stringify(stateObj) };
    return files;
  }

  function pullRemoteState(){
    return resolveGistId().then(function(id){
      if(!id) return {};
      return ghApi("/gists/" + id).then(function(gist){
        var file = gist.files && gist.files[GIST_FILENAME];
        if(!file) return {};
        try { return migrateState(JSON.parse(file.content || "{}")); } catch(e){ return {}; }
      });
    });
  }

  function pushRemoteState(stateObj){
    return resolveGistId().then(function(id){
      if(id){
        return ghApi("/gists/" + id, { method: "PATCH", body: JSON.stringify({ files: makeFilesPayload(stateObj) }) });
      }
      return ghApi("/gists", {
        method: "POST",
        body: JSON.stringify({
          description: "ML Topics — прогресс (автоматически, руками не редактировать)",
          public: false,
          files: makeFilesPayload(stateObj)
        })
      }).then(function(gist){
        try { localStorage.setItem(GH_GIST_ID_KEY, gist.id); } catch(e){}
        return gist;
      });
    });
  }

  function mergeStates(local, remote){
    var merged = {};
    var catIds = Object.keys(local).concat(Object.keys(remote)).filter(function(v,i,a){ return a.indexOf(v)===i; });
    catIds.forEach(function(catId){
      merged[catId] = {};
      var lc = local[catId] || {}, rc = remote[catId] || {};
      var codes = Object.keys(lc).concat(Object.keys(rc)).filter(function(v,i,a){ return a.indexOf(v)===i; });
      codes.forEach(function(code){
        var l = lc[code], r = rc[code];
        if(l && r){ merged[catId][code] = (l.t || 0) >= (r.t || 0) ? l : r; }
        else { merged[catId][code] = l || r; }
      });
    });
    return merged;
  }

  var syncTimer = null;
  function scheduleSyncPush(){
    if(!ghToken()) return;
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){ syncNow().catch(function(){}); }, SYNC_DEBOUNCE_MS);
  }

  function syncNow(){
    if(!ghToken()){ return Promise.reject(new Error("not connected")); }
    sync.syncing = true; sync.error = null; notifySync();
    return pullRemoteState().then(function(remote){
      var merged = mergeStates(state, remote);
      state = merged;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
      route();
      return pushRemoteState(merged);
    }).then(function(){
      sync.syncing = false; sync.connected = true; sync.lastSyncAt = Date.now();
      notifySync();
    }).catch(function(err){
      sync.syncing = false; sync.error = err.message || String(err);
      notifySync();
      throw err;
    });
  }

  function connectSync(token){
    setGhToken(token);
    sync.error = null; sync.syncing = true; notifySync();
    return ghApi("/user").then(function(user){
      sync.login = user.login;
      try { localStorage.setItem(GH_LOGIN_KEY, user.login); } catch(e){}
      sync.connected = true;
      return syncNow();
    }).catch(function(err){
      sync.syncing = false; sync.connected = false; sync.error = err.message || String(err);
      setGhToken(null);
      notifySync();
      throw err;
    });
  }

  function disconnectSync(){
    setGhToken(null);
    sync.connected = false; sync.login = null; sync.error = null; sync.lastSyncAt = null;
    notifySync();
  }

  try {
    if(ghToken()){
      sync.connected = true;
      sync.login = localStorage.getItem(GH_LOGIN_KEY) || null;
    }
  } catch(e){}

  function downloadText(filename, text){
    var blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function showConfirm(message, onConfirm, cancelLabel, confirmLabel){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<p>' + escapeHtml(message) + '</p>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn-cancel">' + escapeHtml(cancelLabel || "Cancel") + '</button>' +
          '<button type="button" class="btn-confirm">' + escapeHtml(confirmLabel || "Reset") + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);

    function close(){
      document.removeEventListener("keydown", onKey);
      backdrop.remove();
    }
    function onKey(e){ if(e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);

    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
    backdrop.querySelector(".btn-cancel").addEventListener("click", close);
    backdrop.querySelector(".btn-confirm").addEventListener("click", function(){
      close();
      onConfirm();
    });
  }

  var ICON_CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

  var syncPanelRefresh = null;

  function openSettingsPanel(){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = '<div class="modal settings-modal" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(backdrop);
    var modal = backdrop.querySelector(".settings-modal");

    function render(){
      var s = t();

      var langSection =
        '<div class="settings-section">' +
          '<div class="settings-label">' + escapeHtml(s.langLabel) + '</div>' +
          '<div class="lang-toggle">' +
            '<button type="button" class="lang-opt' + (LANG === "ru" ? " active" : "") + '" data-lang="ru">RU</button>' +
            '<button type="button" class="lang-opt' + (LANG === "en" ? " active" : "") + '" data-lang="en">EN</button>' +
          '</div>' +
        '</div>';

      var syncBody;
      if(sync.connected){
        syncBody =
          '<p class="sync-connected-as">' + escapeHtml(s.syncConnectedAs(sync.login || "…")) + '</p>' +
          '<p class="sync-last">' + escapeHtml(sync.lastSyncAt ? s.syncLastSync(formatDate(sync.lastSyncAt)) : s.syncNeverSynced) + '</p>' +
          (sync.error ? '<p class="sync-error">' + escapeHtml(s.syncErrorPrefix + sync.error) + '</p>' : '') +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-cancel sync-disconnect-btn">' + escapeHtml(s.syncDisconnectBtn) + '</button>' +
            '<button type="button" class="btn-confirm sync-now-btn"' + (sync.syncing ? ' disabled' : '') + '>' +
              escapeHtml(sync.syncing ? s.syncing : s.syncNowBtn) +
            '</button>' +
          '</div>';
      } else {
        syncBody =
          '<p class="sync-intro">' + escapeHtml(s.syncIntro) + '</p>' +
          '<p class="sync-howto">' + escapeHtml(s.syncHowTo) +
            '<a href="https://github.com/settings/tokens/new?scopes=gist&description=ML%20Topics%20sync" target="_blank" rel="noopener">' +
              escapeHtml(s.syncHowToLinkText) +
            '</a>' + escapeHtml(s.syncHowToAfter) + '</p>' +
          '<label class="sync-token-label">' + escapeHtml(s.syncTokenLabel) +
            '<input type="password" class="sync-token-input" placeholder="' + escapeHtml(s.syncTokenPlaceholder) + '" autocomplete="off" spellcheck="false">' +
          '</label>' +
          (sync.error ? '<p class="sync-error">' + escapeHtml(s.syncErrorPrefix + sync.error) + '</p>' : '') +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-confirm sync-connect-btn"' + (sync.syncing ? ' disabled' : '') + '>' +
              escapeHtml(sync.syncing ? s.syncing : s.syncConnectBtn) +
            '</button>' +
          '</div>';
      }

      modal.innerHTML =
        '<div class="sync-head"><h3>' + escapeHtml(s.settingsTitle) + '</h3>' +
          '<button type="button" class="icon-btn sync-close-btn" aria-label="' + escapeHtml(s.syncClose) + '">' + ICON_CLOSE + '</button>' +
        '</div>' +
        langSection +
        '<div class="settings-divider"></div>' +
        '<div class="settings-section">' +
          '<div class="settings-label">' + escapeHtml(s.syncSectionLabel) + '</div>' +
          syncBody +
        '</div>';
    }
    render();
    syncPanelRefresh = render;

    function close(){
      syncPanelRefresh = null;
      document.removeEventListener("keydown", onKey);
      backdrop.remove();
    }
    function onKey(e){ if(e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });

    modal.addEventListener("click", function(e){
      var langOpt = e.target.closest(".lang-opt");
      if(langOpt){
        var newLang = langOpt.getAttribute("data-lang");
        if(newLang !== LANG){
          LANG = newLang;
          try { localStorage.setItem(LANG_KEY, LANG); } catch(err){}
          refreshChrome();
          var scrollY = scrollArea.scrollTop;
          loadAll().then(function(){ route(); scrollArea.scrollTo(0, scrollY); render(); });
        }
        return;
      }
      if(e.target.closest(".sync-close-btn")){ close(); return; }
      if(e.target.closest(".sync-disconnect-btn")){ disconnectSync(); render(); return; }
      if(e.target.closest(".sync-now-btn")){ syncNow().catch(function(){}); return; }
      if(e.target.closest(".sync-connect-btn")){
        var input = modal.querySelector(".sync-token-input");
        var tok = input ? input.value.trim() : "";
        if(!tok) return;
        connectSync(tok).then(render).catch(function(){ render(); });
      }
    });
  }

  // ---------------------------------------------------------------------
  // Minimal markdown parser tailored to our checklist format:
  //   # Title
  //   ## Part
  //   ### Section
  //   - [ ] CODE text   (checkbox item, code = leading "1.1" / "I.1.1" token)
  // ---------------------------------------------------------------------
  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function inlineMd(text){
    var html = escapeHtml(text);
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function(_, label, url){
      return '<a href="' + url + '" target="_blank" rel="noopener">' + label + '</a>';
    });
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    return html;
  }

  // Коды (I, I.1, I.1.1, ...) нигде не пишутся руками в .md — их всегда
  // выводит рендер из порядка заголовков/пунктов в файле. Так порядок можно
  // менять местами, ничего не пересчитывая.
  function toRoman(num){
    var map = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],
               [50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
    var out = "";
    map.forEach(function(pair){
      while(num >= pair[0]){ out += pair[1]; num -= pair[0]; }
    });
    return out || String(num);
  }

  function parseMarkdown(src, catId){
    var lines = src.split(/\r?\n/);
    var title = catId;
    var parts = [];
    var curPart = null, curSection = null;
    var items = [];
    var partN = 0;

    function ensurePart(){
      if(!curPart){
        partN++;
        curPart = { title:"", code: toRoman(partN), childN: 0, entries: [] };
        parts.push(curPart);
      }
    }

    lines.forEach(function(line){
      var l = line.trim();
      if(!l) return;

      var m;
      if((m = /^#\s+(.*)$/.exec(l))){
        title = m[1].trim();
      } else if((m = /^##\s+(.*)$/.exec(l))){
        partN++;
        curPart = { title: m[1].trim(), code: toRoman(partN), childN: 0, entries: [] };
        curSection = null;
        parts.push(curPart);
      } else if((m = /^###\s+(.*)$/.exec(l))){
        ensurePart();
        curPart.childN++;
        var sectionCode = curPart.code + "." + curPart.childN;
        curSection = { title: m[1].trim(), code: sectionCode, autoN: 0, items: [] };
        curPart.entries.push({ type:"section", section: curSection });
      } else if((m = /^-\s+\[( |x|X)\](\{[^}]*\})?\s+(.*)$/i.exec(l))){
        var defaultChecked = m[1].toLowerCase() === "x";
        var tags = parseTags(m[2]);
        var text = m[3].trim();
        var code;
        if(curSection){
          curSection.autoN++;
          code = curSection.code + "." + curSection.autoN;
        } else {
          ensurePart();
          curPart.childN++;
          code = curPart.code + "." + curPart.childN;
        }
        var item = { code: code, text: text, defaultChecked: defaultChecked, research: tags.research, practice: tags.practice, gid: tags.id, after: tags.after };
        items.push(item);
        if(curSection){ curSection.items.push(item); }
        else { curPart.entries.push({ type:"item", item: item }); }
      }
    });

    return { id: catId, title: title, parts: parts, items: items, graph: buildGraph(items) };
  }

  // Разбор тега после чекбокса: {r} — ресерч-тема (как раньше), а также
  // {id:xxx} — присваивает пункту стабильный id для графа зависимостей,
  // {after:xxx,yyy} — связи в графе прописываются явно руками в .md,
  // не выводятся автоматически из структуры Part/Section/Item.
  function parseTags(raw){
    var out = { research: false, practice: false, id: null, after: [] };
    if(!raw) return out;
    var inner = raw.slice(1, -1);
    inner.split(/\s+/).forEach(function(tok){
      if(!tok) return;
      var m;
      if(tok === "r"){ out.research = true; return; }
      if(tok === "p"){ out.practice = true; return; }
      if((m = /^id:(.+)$/.exec(tok))){ out.id = m[1]; return; }
      if((m = /^after:(.+)$/.exec(tok))){ out.after = m[1].split(",").filter(Boolean); return; }
    });
    return out;
  }

  // Строит граф зависимостей темы из явных {id:}/{after:} тегов.
  // Пункты без этих тегов в граф не попадают (граф — опциональная,
  // курируемая руками надстройка, а не авто-вывод из оглавления).
  function buildGraph(items){
    var byGid = {};
    items.forEach(function(it){ if(it.gid) byGid[it.gid] = it; });
    var nodeSet = {}, nodes = [], edges = [];
    function addNode(it){
      if(!nodeSet[it.code]){ nodeSet[it.code] = true; nodes.push(it); }
    }
    items.forEach(function(it){
      if(it.gid || (it.after && it.after.length)) addNode(it);
    });
    items.forEach(function(it){
      (it.after || []).forEach(function(depGid){
        var dep = byGid[depGid];
        if(!dep) return;
        addNode(dep);
        edges.push({ source: dep.code, target: it.code });
      });
    });
    return { nodes: nodes, edges: edges };
  }

  // ---------------------------------------------------------------------
  // data loading
  // ---------------------------------------------------------------------
  var CATALOG = {};
  var ORDER = [];
  var MANIFEST = null;

  function loadAll(){
    var manifestPromise = MANIFEST
      ? Promise.resolve(MANIFEST)
      : fetch("content/manifest.json").then(function(r){
          if(!r.ok) throw new Error("manifest fetch failed: " + r.status);
          return r.json();
        }).then(function(m){ MANIFEST = m; return m; });

    return manifestPromise.then(function(manifest){
      ORDER = manifest.map(function(m){ return m.id; });
      return Promise.all(manifest.map(function(entry){
        return fetch("content/" + LANG + "/" + entry.file).then(function(r){
          if(!r.ok) throw new Error("fetch failed: " + entry.file);
          return r.text();
        }).then(function(text){
          var parsed = parseMarkdown(text, entry.id);
          var localTitle = LANG === "en" ? (entry.title_en || entry.title) : entry.title;
          if(localTitle) parsed.title = localTitle;
          parsed.raw = text;
          parsed.file = entry.file;
          parsed.domain = entry.domain || "";
          CATALOG[entry.id] = parsed;
        });
      }));
    });
  }

  // Темы с тегом {r} (research) и {p} (practice) — необязательные бонусные
  // уровни: не входят в знаменатель основного процента, но если пройдены —
  // дают бонус сверху (общий % курса может уйти выше 100). Независимы друг
  // от друга: пункт может нести оба тега сразу и считаться в обоих бонусах.
  function splitItems(items){
    var normal = [], research = [], practice = [];
    items.forEach(function(it){
      if(!it.research && !it.practice) normal.push(it);
      if(it.research) research.push(it);
      if(it.practice) practice.push(it);
    });
    return { normal: normal, research: research, practice: practice };
  }

  function computeProgress(catId, items){
    var s = splitItems(items);
    var doneNormal = 0, doneResearch = 0, donePractice = 0;
    s.normal.forEach(function(it){ if(isChecked(catId, it.code, it.defaultChecked)) doneNormal++; });
    s.research.forEach(function(it){ if(isChecked(catId, it.code, it.defaultChecked)) doneResearch++; });
    s.practice.forEach(function(it){ if(isChecked(catId, it.code, it.defaultChecked)) donePractice++; });
    var total = s.normal.length;
    // pct — чистый % обычных тем (0-100, ведёт ширину основного бара).
    // totalPct — с бонусом за research+practice сверху, может уйти выше 100 (для текста).
    var pct = total ? Math.round(doneNormal / total * 100) : 0;
    var totalPct = total ? Math.round((doneNormal + doneResearch + donePractice) / total * 100) : 0;
    return {
      done: doneNormal, total: total, pct: pct, totalPct: totalPct,
      doneResearch: doneResearch, totalResearch: s.research.length,
      researchPct: s.research.length ? Math.round(doneResearch / s.research.length * 100) : 0,
      donePractice: donePractice, totalPractice: s.practice.length,
      practicePct: s.practice.length ? Math.round(donePractice / s.practice.length * 100) : 0
    };
  }

  function progressFor(catId){
    var cat = CATALOG[catId];
    if(!cat) return { done:0, total:0, pct:0, totalPct:0, doneResearch:0, totalResearch:0, researchPct:0, donePractice:0, totalPractice:0, practicePct:0 };
    return computeProgress(catId, cat.items);
  }

  function partItems(part){
    var out = [];
    part.entries.forEach(function(entry){
      if(entry.type === "section") out = out.concat(entry.section.items);
      else out.push(entry.item);
    });
    return out;
  }

  function progressForItems(catId, items){
    return computeProgress(catId, items);
  }

  // ---------------------------------------------------------------------
  // rendering
  // ---------------------------------------------------------------------
  var app = document.getElementById("app");

  var DOMAIN_LABEL_KEY = { ml: "domainMl", math: "domainMath" };

  function renderCard(id){
    var cat = CATALOG[id];
    var p = progressFor(id);
    var card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;

    var countsHtml = '<span class="count-normal">' + p.done + '/' + p.total + '</span>';
    if(p.totalResearch){
      countsHtml += '<span class="count-research">' + p.doneResearch + '/' + p.totalResearch + '</span>';
    }
    if(p.totalPractice){
      countsHtml += '<span class="count-practice">' + p.donePractice + '/' + p.totalPractice + '</span>';
    }

    var barHtml;
    if(p.totalResearch || p.totalPractice){
      barHtml =
        '<div class="bar-group">' +
          '<div class="bar" style="flex:' + p.total + '"><i style="width:' + Math.min(p.pct, 100) + '%"></i></div>' +
          (p.totalResearch ? '<div class="bar bar-bonus" style="flex:' + p.totalResearch + '"><i style="width:' + p.researchPct + '%"></i></div>' : '') +
          (p.totalPractice ? '<div class="bar bar-practice" style="flex:' + p.totalPractice + '"><i style="width:' + p.practicePct + '%"></i></div>' : '') +
        '</div>';
    } else {
      barHtml = '<div class="bar"><i style="width:' + Math.min(p.pct, 100) + '%"></i></div>';
    }

    card.innerHTML =
      '<h2>' + escapeHtml(cat.title) + '</h2>' +
      '<div>' +
        '<div class="meta"><span class="counts">' + countsHtml + '</span><span class="pct">' + p.totalPct + '%</span></div>' +
        barHtml +
      '</div>';
    function go(){ location.hash = "#/" + id; }
    card.addEventListener("click", go);
    card.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });
    return card;
  }

  function renderHome(){
    var head = document.createElement("header");
    head.className = "top";
    head.innerHTML = '<h1>ML Topics</h1>';

    app.innerHTML = "";
    app.appendChild(head);

    var lastDomain;
    var grid = null;
    ORDER.forEach(function(id){
      var cat = CATALOG[id];
      if(!cat) return;
      if(cat.domain !== lastDomain){
        lastDomain = cat.domain;
        var labelKey = DOMAIN_LABEL_KEY[cat.domain];
        if(labelKey){
          var heading = document.createElement("div");
          heading.className = "domain-heading";
          heading.textContent = t()[labelKey];
          app.appendChild(heading);
        }
        grid = document.createElement("div");
        grid.className = "grid";
        app.appendChild(grid);
      }
      grid.appendChild(renderCard(id));
    });
  }

  function formatDate(ts){
    try {
      return new Intl.DateTimeFormat(LANG === "ru" ? "ru-RU" : "en-US", {
        year: "numeric", month: "short", day: "numeric"
      }).format(new Date(ts));
    } catch(e){ return ""; }
  }

  function formatDateShort(ts){
    try {
      return new Intl.DateTimeFormat(LANG === "ru" ? "ru-RU" : "en-US", {
        month: "short", day: "numeric"
      }).format(new Date(ts));
    } catch(e){ return ""; }
  }

  function renderItem(catId, item){
    var row = document.createElement("label");
    row.className = "item" + (item.research ? " research" : "") + (item.practice ? " practice" : "");
    var checked = isChecked(catId, item.code, item.defaultChecked);
    if(checked) row.classList.add("checked");

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = checked;

    var label = document.createElement("span");
    label.className = "txt label";
    label.innerHTML = '<span class="code">' + escapeHtml(item.code) + '</span>' + inlineMd(item.text);
    // ссылка вложена в <label> (он же чекбокс) — без stopPropagation клик по
    // ссылке ещё и тогглит чекбокс, а на тач-устройствах это вообще ломает
    // переход по ссылке (нативная активация лейбла "перехватывает" тап)
    label.querySelectorAll("a").forEach(function(a){
      a.addEventListener("click", function(e){ e.stopPropagation(); });
    });

    var dateEl = document.createElement("span");
    dateEl.className = "done-date";

    row.appendChild(cb);
    row.appendChild(label);
    row.appendChild(dateEl);

    function updateDoneTitle(){
      var parts = [];
      if(item.research) parts.push(t().researchHint);
      if(item.practice) parts.push(t().practiceHint);
      var at = checkedAt(catId, item.code);
      if(at) parts.push(t().completedOn(formatDate(at)));
      row.title = parts.join(" · ");
      dateEl.textContent = at ? formatDateShort(at) : "";
    }
    updateDoneTitle();

    cb.addEventListener("change", function(){
      setChecked(catId, item.code, cb.checked);
      row.classList.toggle("checked", cb.checked);
      updateDoneTitle();
      updateDetailProgress(catId);
    });

    return row;
  }

  var progressEls = null;

  function updateDetailProgress(catId){
    var cat = CATALOG[catId];
    var p = progressFor(catId);
    if(!progressEls || !cat) return;
    progressEls.frac.textContent = p.done + " / " + p.total;
    if(progressEls.fracResearch) progressEls.fracResearch.textContent = p.totalResearch ? p.doneResearch + " / " + p.totalResearch : "";
    if(progressEls.fracPractice) progressEls.fracPractice.textContent = p.totalPractice ? p.donePractice + " / " + p.totalPractice : "";
    if(progressEls.fracPct) progressEls.fracPct.textContent = "(" + p.totalPct + "%)";
    progressEls.segments.forEach(function(seg){
      var sp = progressForItems(catId, seg.items);
      seg.fill.style.width = Math.min(sp.pct, 100) + "%";
      if(seg.bonusFill) seg.bonusFill.style.width = sp.researchPct + "%";
      if(seg.practiceFill) seg.practiceFill.style.width = sp.practicePct + "%";
    });
  }

  // ---------------------------------------------------------------------
  // граф зависимостей тем (мини-превью в углу + фулскрин-оверлей).
  // Данные графа строятся из явных {id:}/{after:} тегов в контенте —
  // см. buildGraph()/parseTags() выше; сами узлы/связи не выводятся
  // автоматически из структуры Part/Section/Item.
  // ---------------------------------------------------------------------
  var ICON_GRAPH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.1"></circle><circle cx="19" cy="6" r="2.1"></circle><circle cx="12" cy="13" r="2.1"></circle><circle cx="5" cy="19" r="2.1"></circle><circle cx="19" cy="19" r="2.1"></circle><line x1="6.6" y1="7.3" x2="10.5" y2="11.4"></line><line x1="17.4" y1="7.3" x2="13.5" y2="11.4"></line><line x1="10.5" y1="14.6" x2="6.6" y2="17.7"></line><line x1="13.5" y1="14.6" x2="17.4" y2="17.7"></line></svg>';
  var ICON_EXPAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>';
  var ICON_FILTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 4 20 4 14 12 14 19 10 21 10 12 4 4"></polygon></svg>';

  var D3_SRC = "https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js";
  var d3Promise = null;
  function ensureD3(){
    if(window.d3) return Promise.resolve();
    if(d3Promise) return d3Promise;
    d3Promise = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = D3_SRC;
      s.onload = function(){ resolve(); };
      s.onerror = function(){ d3Promise = null; reject(new Error("d3 load failed")); };
      document.head.appendChild(s);
    });
    return d3Promise;
  }

  // топологические "уровни" узлов (для потока сверху вниз): длиннейший путь
  // от корня — устойчиво к отсутствию корней/случайным циклам в разметке
  function computeGraphLevels(nodes, edges){
    var incomingCount = {}, outgoing = {};
    nodes.forEach(function(n){ incomingCount[n.code] = 0; outgoing[n.code] = []; });
    edges.forEach(function(e){
      if(outgoing[e.source]) outgoing[e.source].push(e.target);
      if(incomingCount[e.target] !== undefined) incomingCount[e.target]++;
    });
    var level = {}, queue = [];
    nodes.forEach(function(n){ if(!incomingCount[n.code]){ level[n.code] = 0; queue.push(n.code); } });
    if(!queue.length && nodes.length){ level[nodes[0].code] = 0; queue.push(nodes[0].code); }
    var guard = 0, maxGuard = (nodes.length + 1) * (edges.length + 1) + 20;
    while(queue.length && guard < maxGuard){
      guard++;
      var cur = queue.shift();
      (outgoing[cur] || []).forEach(function(next){
        var cand = level[cur] + 1;
        if(level[next] === undefined || cand > level[next]){
          level[next] = cand;
          queue.push(next);
        }
      });
    }
    nodes.forEach(function(n){ if(level[n.code] === undefined) level[n.code] = 0; });
    return level;
  }

  // мини-превью: точка без подписи (title — на hover)
  function graphDotEl(n, catId){
    var el = document.createElement("div");
    el.className = "graph-node graph-dot" +
      (n.research ? " research" : "") + (n.practice ? " practice" : "") + (isChecked(catId, n.code) ? " checked" : "");
    el.title = n.text;
    el.dataset.code = n.code;
    return el;
  }

  function tagClass(n){
    return (n.research ? " research" : "") + (n.practice ? " practice" : "");
  }

  // степень узла (кол-во рёбер) — изолированные узлы (0 связей) получают
  // более сильное центрирование, иначе их разбрасывает случайным зарядом
  // далеко от основного облака (см. правки этой сессии по жалобе "точки
  // болтаются далеко от центра")
  function degreeMap(simEdges){
    var deg = {};
    simEdges.forEach(function(e){
      deg[e.sourceCode] = (deg[e.sourceCode] || 0) + 1;
      deg[e.targetCode] = (deg[e.targetCode] || 0) + 1;
    });
    return deg;
  }

  // общая камера графа: драг (мышь/тач) — панорама, колесо — зум к курсору,
  // два пальца — pinch-zoom к их середине. Используется и мини-превью, и
  // фулскрин-графом, чтобы не дублировать пан/зум/pinch логику дважды.
  function bindGraphCamera(container, camera, onApply, opts){
    opts = opts || {};
    var pointers = {};
    var panState = null, pinchState = null;
    var dragDist = 0;

    function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
    function mid(a, b){ return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

    container.addEventListener("pointerdown", function(e){
      if(opts.panExclude && e.target.closest(opts.panExclude)) return;
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      try { container.setPointerCapture(e.pointerId); } catch(err){}
      var ids = Object.keys(pointers);
      if(ids.length === 2){
        panState = null;
        var a = pointers[ids[0]], b = pointers[ids[1]];
        pinchState = { startDist: Math.max(dist(a, b), 1), startK: camera.k, camX: camera.x, camY: camera.y, startMid: mid(a, b) };
      } else if(ids.length === 1){
        dragDist = 0;
        panState = { x: e.clientX, y: e.clientY, camX: camera.x, camY: camera.y };
        container.classList.add("panning");
      }
    });

    container.addEventListener("pointermove", function(e){
      if(!(e.pointerId in pointers)) return;
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);
      var rect = container.getBoundingClientRect();
      if(ids.length === 2 && pinchState){
        var a = pointers[ids[0]], b = pointers[ids[1]];
        var newK = Math.min(camera.kMax, Math.max(camera.kMin, pinchState.startK * (dist(a, b) / pinchState.startDist)));
        var m0x = pinchState.startMid.x - rect.left, m0y = pinchState.startMid.y - rect.top;
        var worldX = (m0x - pinchState.camX) / pinchState.startK, worldY = (m0y - pinchState.camY) / pinchState.startK;
        var m1 = mid(a, b);
        camera.k = newK;
        camera.x = (m1.x - rect.left) - worldX * newK;
        camera.y = (m1.y - rect.top) - worldY * newK;
        onApply();
      } else if(ids.length === 1 && panState){
        dragDist += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0);
        camera.x = panState.camX + (e.clientX - panState.x);
        camera.y = panState.camY + (e.clientY - panState.y);
        onApply();
      }
    });

    function endPointer(e){
      delete pointers[e.pointerId];
      var ids = Object.keys(pointers);
      pinchState = null;
      if(ids.length === 1){
        panState = { x: pointers[ids[0]].x, y: pointers[ids[0]].y, camX: camera.x, camY: camera.y };
      } else {
        panState = null;
        container.classList.remove("panning");
      }
    }
    container.addEventListener("pointerup", endPointer);
    container.addEventListener("pointercancel", endPointer);

    container.addEventListener("wheel", function(e){
      e.preventDefault();
      var rect = container.getBoundingClientRect();
      var mx = e.clientX - rect.left, my = e.clientY - rect.top;
      var worldX = (mx - camera.x) / camera.k, worldY = (my - camera.y) / camera.k;
      var factor = Math.exp(-e.deltaY * 0.0012);
      var newK = Math.min(camera.kMax, Math.max(camera.kMin, camera.k * factor));
      camera.k = newK;
      camera.x = mx - worldX * newK;
      camera.y = my - worldY * newK;
      onApply();
    }, { passive: false });

    // "одноразовый" флаг: читаем и сразу гасим, иначе значение от старого
    // жеста утечёт в следующий несвязанный клик (например, по кнопке "развернуть")
    return { didDrag: function(){ var v = dragDist > 4; dragDist = 0; return v; } };
  }

  // мини-превью (Obsidian-style точки): физика прогоняется один раз и
  // "замораживается" (для дешёвого рендера), но камера (пан/зум/pinch,
  // включая колесо при наведении) — живая, как и просили.
  function mountMiniGraphSim(container, catId){
    var graph = CATALOG[catId].graph;
    var w = container.clientWidth || 200, h = container.clientHeight || 200;
    var levels = computeGraphLevels(graph.nodes, graph.edges);
    var simNodes = graph.nodes.map(function(n){
      return { code: n.code, text: n.text, research: !!n.research, practice: !!n.practice, level: levels[n.code] || 0 };
    });
    var byCode = {};
    simNodes.forEach(function(n){ byCode[n.code] = n; });
    var simEdges = graph.edges
      .filter(function(e){ return byCode[e.source] && byCode[e.target]; })
      .map(function(e){ return { source: e.source, target: e.target, sourceCode: e.source, targetCode: e.target }; });
    var degree = degreeMap(simEdges);

    var maxLevel = simNodes.reduce(function(m, n){ return Math.max(m, n.level); }, 0);
    var DOT = 7;
    var levelGap = Math.max(16, (h - 20) / (maxLevel + 1));

    container.innerHTML = "";
    var canvas = document.createElement("div");
    canvas.className = "graph-canvas";
    container.appendChild(canvas);

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "graph-edges");
    canvas.appendChild(svg);
    var g = document.createElementNS(svgNS, "g");
    svg.appendChild(g);
    var lineEls = simEdges.map(function(){
      var line = document.createElementNS(svgNS, "line");
      g.appendChild(line);
      return line;
    });

    var nodesLayer = document.createElement("div");
    nodesLayer.className = "graph-nodes-layer";
    canvas.appendChild(nodesLayer);

    var nodeEls = {};
    simNodes.forEach(function(n){
      n.x = (Math.random() - 0.5) * Math.min(w * 0.7, 300);
      n.y = 26 + n.level * levelGap + (Math.random() - 0.5) * 8;
      var el = graphDotEl(n, catId);
      el.style.width = DOT + "px";
      el.style.height = DOT + "px";
      el.style.left = "0"; el.style.top = "0";
      nodesLayer.appendChild(el);
      nodeEls[n.code] = el;
    });

    function paint(){
      simNodes.forEach(function(n){
        nodeEls[n.code].style.transform = "translate(" + (n.x - DOT / 2) + "px," + (n.y - DOT / 2) + "px)";
      });
      simEdges.forEach(function(e, i){
        var s = byCode[e.sourceCode], tn = byCode[e.targetCode];
        var line = lineEls[i];
        line.setAttribute("x1", s.x); line.setAttribute("y1", s.y);
        line.setAttribute("x2", tn.x); line.setAttribute("y2", tn.y);
      });
    }

    var sim = d3.forceSimulation(simNodes)
      .force("link", d3.forceLink(simEdges).id(function(n){ return n.code; }).distance(16).strength(0.7))
      .force("charge", d3.forceManyBody().strength(-16))
      .force("collide", d3.forceCollide(7))
      .force("x", d3.forceX(0).strength(function(n){ return degree[n.code] ? 0.03 : 0.15; }))
      .force("y", d3.forceY(function(n){ return 26 + n.level * levelGap; }).strength(0.4))
      .stop();
    for(var i = 0; i < 300; i++) sim.tick();
    paint();

    // камера: сама подстраивается под контейнер целиком (мин = всё видно)
    var xs = simNodes.map(function(n){ return n.x; });
    var ys = simNodes.map(function(n){ return n.y; });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var gw = Math.max(maxX - minX, 20) + 30, gh = Math.max(maxY - minY, 20) + 30;
    var kFit = Math.min(w / gw, h / gh, 1);
    var camera = { x: w / 2 - (minX + maxX) / 2 * kFit, y: h / 2 - (minY + maxY) / 2 * kFit, k: kFit, kMin: kFit * 0.6, kMax: kFit * 4 };

    function applyCamera(){
      var t = "translate(" + camera.x + "px," + camera.y + "px) scale(" + camera.k + ")";
      nodesLayer.style.transform = t;
      nodesLayer.style.transformOrigin = "0 0";
      g.setAttribute("transform", "translate(" + camera.x + "," + camera.y + ") scale(" + camera.k + ")");
    }
    applyCamera();

    var cam = bindGraphCamera(container, camera, applyCamera, { panExclude: ".graph-node" });

    Object.keys(nodeEls).forEach(function(code){
      nodeEls[code].addEventListener("click", function(e){
        e.stopPropagation();
        var next = !isChecked(catId, code);
        setChecked(catId, code, next);
        nodeEls[code].classList.toggle("checked", next);
      });
    });

    return { stop: function(){ sim.stop(); }, didDrag: cam.didDrag };
  }

  // фулскрин-граф: живая физика, точки с подписью сверху, камера (панорама
  // зажатой мышкой + зум колёсиком) вместо скролла контейнера.
  // partIds: если задан (набор кодов частей "I","II",...) — граф строится
  // только по узлам/рёбрам этих частей (для фильтра по частям в шапке оверлея)
  function mountInteractiveGraph(container, catId, partIds){
    var graph = CATALOG[catId].graph;
    var w = container.clientWidth || 800, h = container.clientHeight || 600;
    var nodesSrc = graph.nodes;
    var edgesSrc = graph.edges;
    if(partIds){
      var allowedCodes = {};
      nodesSrc = nodesSrc.filter(function(n){
        var partCode = n.code.split(".")[0];
        var keep = partIds.indexOf(partCode) !== -1;
        if(keep) allowedCodes[n.code] = true;
        return keep;
      });
      edgesSrc = edgesSrc.filter(function(e){ return allowedCodes[e.source] && allowedCodes[e.target]; });
    }
    var levels = computeGraphLevels(nodesSrc, edgesSrc);
    var simNodes = nodesSrc.map(function(n){
      return { code: n.code, text: n.text, research: !!n.research, practice: !!n.practice, level: levels[n.code] || 0 };
    });
    var byCode = {};
    simNodes.forEach(function(n){ byCode[n.code] = n; });
    // d3.forceLink() мутирует .source/.target из строк-кодов в ссылки на
    // узлы прямо на первом тике — держим исходные коды отдельно для paint()
    var simEdges = edgesSrc
      .filter(function(e){ return byCode[e.source] && byCode[e.target]; })
      .map(function(e){ return { source: e.source, target: e.target, sourceCode: e.source, targetCode: e.target }; });
    var degree = degreeMap(simEdges);

    var DOT = 12;
    var levelGap = 90;

    container.innerHTML = "";
    var canvas = document.createElement("div");
    canvas.className = "graph-canvas";
    container.appendChild(canvas);

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "graph-edges");
    canvas.appendChild(svg);
    var g = document.createElementNS(svgNS, "g");
    svg.appendChild(g);
    var edgesByCode = {};
    var lineEls = simEdges.map(function(e){
      var line = document.createElementNS(svgNS, "line");
      g.appendChild(line);
      (edgesByCode[e.sourceCode] = edgesByCode[e.sourceCode] || []).push(line);
      (edgesByCode[e.targetCode] = edgesByCode[e.targetCode] || []).push(line);
      return line;
    });

    var nodesLayer = document.createElement("div");
    nodesLayer.className = "graph-nodes-layer";
    canvas.appendChild(nodesLayer);

    var dotEls = {}, labelEls = {};
    simNodes.forEach(function(n){
      n.x = (Math.random() - 0.5) * Math.min(w, 600);
      n.y = n.level * levelGap + (Math.random() - 0.5) * 8;
      var cls = tagClass(n) + (isChecked(catId, n.code) ? " checked" : "");
      var dot = document.createElement("div");
      dot.className = "graph-node-dot" + cls;
      dot.style.width = DOT + "px";
      dot.style.height = DOT + "px";
      dot.style.left = "0"; dot.style.top = "0";
      dot.dataset.code = n.code;
      nodesLayer.appendChild(dot);
      dotEls[n.code] = dot;

      var label = document.createElement("div");
      label.className = "graph-node-label" + cls;
      label.textContent = n.text;
      label.style.left = "0"; label.style.top = "0";
      label.dataset.code = n.code;
      nodesLayer.appendChild(label);
      labelEls[n.code] = label;
    });

    // позиционируем через transform (не left/top) — дешевле для лэйаута,
    // важно на мобильных при непрерывном тике живой физики
    function paint(){
      simNodes.forEach(function(n){
        dotEls[n.code].style.transform = "translate(" + (n.x - DOT / 2) + "px," + (n.y - DOT / 2) + "px)";
        labelEls[n.code].style.transform = "translate(" + n.x + "px," + (n.y - DOT / 2 - 6) + "px) translate(-50%,-100%)";
      });
      simEdges.forEach(function(e, i){
        var s = byCode[e.sourceCode], tn = byCode[e.targetCode];
        var line = lineEls[i];
        line.setAttribute("x1", s.x); line.setAttribute("y1", s.y);
        line.setAttribute("x2", tn.x); line.setAttribute("y2", tn.y);
      });
    }

    var sim = d3.forceSimulation(simNodes)
      .force("link", d3.forceLink(simEdges).id(function(n){ return n.code; }).distance(80).strength(0.7))
      .force("charge", d3.forceManyBody().strength(-220))
      .force("collide", d3.forceCollide(50))
      // изолированные узлы (без единой связи) тянет к центру сильнее — иначе
      // случайный заряд разбрасывает их далеко от общего облака
      .force("x", d3.forceX(0).strength(function(n){ return degree[n.code] ? 0.05 : 0.22; }))
      .force("y", d3.forceY(function(n){ return n.level * levelGap; }).strength(0.5))
      .stop();
    // разогрев физики, чтобы сразу было что центрировать в камере, без прыжка на первом кадре
    for(var wi = 0; wi < 120; wi++) sim.tick();

    // ---------------- камера: панорама/pinch (тач и мышь) + зум колёсиком ----------------
    var camera = { x: 0, y: 0, k: 1, kMin: 0.2, kMax: 2.5 };

    function fitToView(){
      var xs = simNodes.map(function(n){ return n.x; });
      var ys = simNodes.map(function(n){ return n.y; });
      var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
      var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
      var gw = Math.max(maxX - minX, 80) + 120, gh = Math.max(maxY - minY, 80) + 120;
      var kFit = Math.min(w / gw, h / gh);
      camera.kMin = Math.min(kFit, 1);
      camera.kMax = Math.max(kFit * 4, 1.6);
      camera.k = kFit;
      camera.x = w / 2 - (minX + maxX) / 2 * kFit;
      camera.y = h / 2 - (minY + maxY) / 2 * kFit;
    }
    fitToView();

    function applyCamera(){
      var t = "translate(" + camera.x + "px," + camera.y + "px) scale(" + camera.k + ")";
      nodesLayer.style.transform = t;
      nodesLayer.style.transformOrigin = "0 0";
      g.setAttribute("transform", "translate(" + camera.x + "," + camera.y + ") scale(" + camera.k + ")");
      var dotSize = 22 * camera.k;
      container.style.backgroundSize = dotSize + "px " + dotSize + "px";
      container.style.backgroundPosition = camera.x + "px " + camera.y + "px";
    }
    applyCamera();
    paint();
    sim.on("tick", paint);
    sim.alpha(0.4).restart();

    bindGraphCamera(container, camera, applyCamera, { panExclude: ".graph-node-dot, .graph-node-label" });

    // клик/драг узла — своя логика на точке и на подписи одного узла разом
    function bindNode(code){
      var dot = dotEls[code], label = labelEls[code];
      var dragging = false, moved = false, start = null;
      function highlight(on){
        dot.classList.toggle("dragging", on);
        (edgesByCode[code] || []).forEach(function(line){ line.classList.toggle("active", on); });
      }
      function onDown(e){
        e.stopPropagation();
        dragging = true; moved = false;
        start = { x: e.clientX, y: e.clientY };
        var n = byCode[code];
        n.fx = n.x; n.fy = n.y;
        sim.alphaTarget(0.3).restart();
        highlight(true);
        try { e.target.setPointerCapture(e.pointerId); } catch(err){}
      }
      function onMove(e){
        if(!dragging) return;
        moved = true;
        var n = byCode[code];
        n.fx += (e.clientX - start.x) / camera.k;
        n.fy += (e.clientY - start.y) / camera.k;
        start = { x: e.clientX, y: e.clientY };
      }
      function onUp(){
        if(!dragging) return;
        dragging = false;
        sim.alphaTarget(0);
        var n = byCode[code];
        n.fx = null; n.fy = null;
        highlight(false);
      }
      function onClick(e){
        if(moved){ moved = false; return; }
        e.stopPropagation();
        var next = !isChecked(catId, code);
        setChecked(catId, code, next);
        dot.classList.toggle("checked", next);
        label.classList.toggle("checked", next);
      }
      [dot, label].forEach(function(el){
        el.addEventListener("pointerdown", onDown);
        el.addEventListener("pointermove", onMove);
        el.addEventListener("pointerup", onUp);
        el.addEventListener("pointercancel", onUp);
        el.addEventListener("click", onClick);
      });
    }
    Object.keys(dotEls).forEach(bindNode);

    return { stop: function(){ sim.stop(); } };
  }

  var miniGraphEl = null, miniGraphSim = null;
  function removeMiniGraph(){
    if(miniGraphSim){ miniGraphSim.stop(); miniGraphSim = null; }
    if(miniGraphEl){ miniGraphEl.remove(); miniGraphEl = null; }
  }

  function mountMiniGraph(catId){
    var miniWrap = document.createElement("div");
    miniWrap.className = "graph-mini";
    // верхушка мини-графа вровень с верхушкой первого блока темы на странице
    var firstPart = document.querySelector(".part");
    if(firstPart) miniWrap.style.top = firstPart.getBoundingClientRect().top + "px";
    miniWrap.innerHTML =
      '<div class="graph-mini-label">' + ICON_GRAPH + escapeHtml(t().graphMiniLabel) + '</div>' +
      '<button type="button" class="graph-mini-expand" aria-label="' + escapeHtml(t().graphBtn) + '" title="' + escapeHtml(t().graphBtn) + '">' + ICON_EXPAND + '</button>';
    var host = document.createElement("div");
    host.style.position = "absolute";
    host.style.inset = "0";
    miniWrap.appendChild(host);
    document.body.appendChild(miniWrap);
    miniGraphEl = miniWrap;

    miniWrap.addEventListener("click", function(e){
      if(e.target.closest(".graph-node")) return;
      if(miniGraphSim && miniGraphSim.didDrag && miniGraphSim.didDrag()) return; // клик после панорамы — не открываем
