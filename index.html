      openGraphOverlay(catId);
    });

    ensureD3().then(function(){
      if(miniGraphEl !== miniWrap) return; // ушли со страницы, пока грузился d3
      miniGraphSim = mountMiniGraphSim(host, catId);
    }).catch(function(){});
  }

  function openGraphOverlay(catId){
    var cat = CATALOG[catId];
    if(!cat || !cat.graph || !cat.graph.nodes.length) return;

    var partOptions = cat.parts.filter(function(p){ return p.title; });
    var selectedParts = null; // null = все части

    var backdrop = document.createElement("div");
    backdrop.className = "graph-overlay-backdrop";
    backdrop.innerHTML =
      '<div class="graph-overlay">' +
        '<div class="graph-overlay-head">' +
          '<h3>' + escapeHtml(cat.title) + ' — ' + escapeHtml(t().graphBtn) + '</h3>' +
          '<div class="graph-overlay-head-actions">' +
            (partOptions.length > 1 ?
              '<button type="button" class="icon-btn graph-parts-btn" aria-label="' + escapeHtml(t().graphPartsBtn) + '" title="' + escapeHtml(t().graphPartsBtn) + '">' + ICON_FILTER + '</button>'
              : '') +
            '<button type="button" class="icon-btn graph-overlay-close" aria-label="' + escapeHtml(t().syncClose) + '">' + ICON_CLOSE + '</button>' +
          '</div>' +
        '</div>' +
        (partOptions.length > 1 ?
          '<div class="graph-parts-popover" hidden>' +
            partOptions.map(function(p){
              return '<label class="graph-parts-opt"><input type="checkbox" checked value="' + escapeHtml(p.code) + '">' + escapeHtml(p.code) + '. ' + escapeHtml(p.title) + '</label>';
            }).join("") +
          '</div>'
          : '') +
        '<div class="graph-overlay-body"></div>' +
      '</div>';
    document.body.appendChild(backdrop);

    // назад на мобилке (жест/аппаратная кнопка) должен закрывать граф, а не
    // "выходить" из курса — держим для этого отдельный history-стейт: если
    // закрываем сами (крестик/esc/клик по фону), гасим его через history.back(),
    // если закрыли именно кнопкой "назад" — popstate уже сам всё сделал
    var closedByPop = false;
    history.pushState({ graphOverlay: true }, "", location.href);

    var sim = null;
    function close(){
      if(sim) sim.stop();
      document.removeEventListener("keydown", onKey);
      window.removeEventListener("popstate", onPopState);
      backdrop.remove();
      renderDetail(catId); // на случай если внутри графа отмечали темы
      if(!closedByPop) history.back();
    }
    function onPopState(){ closedByPop = true; close(); }
    function onKey(e){ if(e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);
    window.addEventListener("popstate", onPopState);
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
    backdrop.querySelector(".graph-overlay-close").addEventListener("click", close);

    var body = backdrop.querySelector(".graph-overlay-body");
    var popover = backdrop.querySelector(".graph-parts-popover");
    var partsBtn = backdrop.querySelector(".graph-parts-btn");

    function remount(){
      if(sim) sim.stop();
      sim = mountInteractiveGraph(body, catId, selectedParts);
    }

    if(partsBtn){
      partsBtn.addEventListener("click", function(e){
        e.stopPropagation();
        popover.hidden = !popover.hidden;
      });
      popover.addEventListener("change", function(){
        var boxes = Array.prototype.slice.call(popover.querySelectorAll("input[type=checkbox]"));
        var checked = boxes.filter(function(b){ return b.checked; }).map(function(b){ return b.value; });
        selectedParts = checked.length === boxes.length ? null : checked;
        remount();
      });
    }

    ensureD3().then(function(){
      if(!document.body.contains(backdrop)) return;
      remount();
    }).catch(function(){});
  }

  function renderDetail(catId){
    var cat = CATALOG[catId];
    if(!cat){
      app.innerHTML = '<a class="back" href="#/">&larr; ' + escapeHtml(t().back) + '</a><div class="empty">' + escapeHtml(t().notFound) + '</div>';
      return;
    }

    app.innerHTML = "";
    removeMiniGraph();

    var hasGraph = !!(cat.graph && cat.graph.nodes.length);

    var head = document.createElement("div");
    head.className = "detail-head";
    var p = progressFor(catId);
    head.innerHTML =
      '<div><h1>' + escapeHtml(cat.title) + '</h1>' +
      '<div class="detail-progress"><span id="frac">' + p.done + ' / ' + p.total + '</span>' +
        (p.totalResearch ? ' <span class="count-research" id="fracResearch">' + p.doneResearch + ' / ' + p.totalResearch + '</span>' : '') +
        (p.totalPractice ? ' <span class="count-practice" id="fracPractice">' + p.donePractice + ' / ' + p.totalPractice + '</span>' : '') +
        ' <span id="fracPct">(' + p.totalPct + '%)</span>' +
      '</div></div>' +
      '<div class="head-actions">' +
        (hasGraph ?
          '<button class="icon-btn graph-btn" type="button" aria-label="' + escapeHtml(t().graphBtn) + '" title="' + escapeHtml(t().graphBtn) + '">' + ICON_GRAPH + '</button>'
          : "") +
        '<button class="icon-btn download-btn" type="button" aria-label="' + escapeHtml(t().download) + '" title="' + escapeHtml(t().download) + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M4 19h16"/></svg>' +
        '</button>' +
        '<button class="icon-btn reset-btn" type="button" aria-label="' + escapeHtml(t().reset) + '" title="' + escapeHtml(t().reset) + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>' +
        '</button>' +
      '</div>';
    app.appendChild(head);

    if(hasGraph){
      head.querySelector(".graph-btn").addEventListener("click", function(){ openGraphOverlay(catId); });
    }

    var bar = document.createElement("div");
    bar.className = "bar-segments";
    var segments = [];
    cat.parts.forEach(function(part){
      var items = partItems(part);
      if(!items.length) return;
      var sp = progressForItems(catId, items);

      var group = document.createElement("div");
      group.className = "seg-group";
      group.style.flex = (sp.total + sp.totalResearch + sp.totalPractice) + " 1 0";

      var seg = document.createElement("div");
      seg.className = "seg";
      seg.style.flex = sp.total + " 1 0";
      seg.title = (part.title || cat.title) + ": " + sp.done + " / " + sp.total +
        (sp.totalResearch ? " (+" + sp.doneResearch + "/" + sp.totalResearch + " R)" : "") +
        (sp.totalPractice ? " (+" + sp.donePractice + "/" + sp.totalPractice + " P)" : "");
      var fill = document.createElement("i");
      fill.style.width = Math.min(sp.pct, 100) + "%";
      seg.appendChild(fill);
      group.appendChild(seg);

      var bonusFill = null;
      if(sp.totalResearch){
        var bonusSeg = document.createElement("div");
        bonusSeg.className = "seg seg-bonus";
        bonusSeg.style.flex = sp.totalResearch + " 1 0";
        bonusSeg.title = seg.title;
        bonusFill = document.createElement("i");
        bonusFill.style.width = sp.researchPct + "%";
        bonusSeg.appendChild(bonusFill);
        group.appendChild(bonusSeg);
      }

      var practiceFill = null;
      if(sp.totalPractice){
        var practiceSeg = document.createElement("div");
        practiceSeg.className = "seg seg-practice";
        practiceSeg.style.flex = sp.totalPractice + " 1 0";
        practiceSeg.title = seg.title;
        practiceFill = document.createElement("i");
        practiceFill.style.width = sp.practicePct + "%";
        practiceSeg.appendChild(practiceFill);
        group.appendChild(practiceSeg);
      }

      bar.appendChild(group);
      segments.push({ items: items, fill: fill, bonusFill: bonusFill, practiceFill: practiceFill });
    });
    app.appendChild(bar);

    progressEls = { frac: head.querySelector("#frac"), fracResearch: head.querySelector("#fracResearch"), fracPractice: head.querySelector("#fracPractice"), fracPct: head.querySelector("#fracPct"), segments: segments };

    head.querySelector(".download-btn").addEventListener("click", function(){
      downloadText(cat.file || (catId + ".md"), cat.raw || "");
    });

    head.querySelector(".reset-btn").addEventListener("click", function(){
      showConfirm(t().resetConfirm(cat.title), function(){
        resetCategory(catId);
        renderDetail(catId);
      }, t().cancel, t().confirmBtn);
    });

    cat.parts.forEach(function(part){
      var partEl = document.createElement("div");
      partEl.className = "part";
      if(part.title){
        var h2 = document.createElement("h2");
        h2.textContent = t().partWord + " " + part.code + ". " + part.title;
        partEl.appendChild(h2);
      }
      part.entries.forEach(function(entry){
        if(entry.type === "section"){
          var secEl = document.createElement("div");
          secEl.className = "section";
          var h3 = document.createElement("h3");
          h3.textContent = entry.section.code + " " + entry.section.title;
          secEl.appendChild(h3);
          entry.section.items.forEach(function(item){
            secEl.appendChild(renderItem(catId, item));
          });
          partEl.appendChild(secEl);
        } else {
          partEl.appendChild(renderItem(catId, entry.item));
        }
      });
      app.appendChild(partEl);
    });

    if(hasGraph && window.matchMedia("(min-width:1280px)").matches){
      mountMiniGraph(catId);
    }
  }

  // ---------------------------------------------------------------------
  // floating nav buttons (back / scroll-to-top)
  // ---------------------------------------------------------------------
  var ICON_LEFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
  var ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>';

  var scrollArea = document.getElementById("scrollArea");

  var backBtn = document.createElement("button");
  backBtn.id = "backBtn";
  backBtn.className = "fab";
  backBtn.type = "button";
  backBtn.innerHTML = ICON_LEFT;
  backBtn.addEventListener("click", function(){ location.hash = "#/"; });
  document.body.appendChild(backBtn);

  var topBtn = document.createElement("button");
  topBtn.id = "topBtn";
  topBtn.className = "fab";
  topBtn.type = "button";
  topBtn.innerHTML = ICON_UP;
  topBtn.addEventListener("click", function(){ scrollArea.scrollTo({ top:0, behavior:"smooth" }); });
  document.body.appendChild(topBtn);

  scrollArea.addEventListener("scroll", function(){
    topBtn.classList.toggle("visible", scrollArea.scrollTop > 400);
  });

  var ICON_GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>';

  var settingsBtn = document.createElement("button");
  settingsBtn.id = "settingsBtn";
  settingsBtn.className = "fab";
  settingsBtn.type = "button";
  settingsBtn.innerHTML = ICON_GEAR;
  settingsBtn.addEventListener("click", openSettingsPanel);
  document.body.appendChild(settingsBtn);

  function refreshChrome(){
    backBtn.setAttribute("aria-label", t().back);
    backBtn.title = t().back;
    topBtn.setAttribute("aria-label", t().top);
    topBtn.title = t().top;
    settingsBtn.setAttribute("aria-label", t().settingsTitle);
    settingsBtn.title = t().settingsTitle;
    document.documentElement.lang = LANG;
  }
  refreshChrome();

  var footer = document.createElement("div");
  footer.className = "site-footer";
  footer.innerHTML = '<a href="https://github.com/qubeyond" target="_blank" rel="noopener">github.com/qubeyond</a>';
  document.body.appendChild(footer);

  sync.onChange = function(){ if(syncPanelRefresh) syncPanelRefresh(); };

  // ---------------------------------------------------------------------
  // router
  // ---------------------------------------------------------------------
  function route(){
    var hash = location.hash.replace(/^#\/?/, "");
    backBtn.style.display = hash ? "flex" : "none";
    settingsBtn.style.display = hash ? "none" : "flex";
    document.body.classList.toggle("is-home", !hash);
    if(!hash){ removeMiniGraph(); renderHome(); return; }
    renderDetail(hash);
  }

  window.addEventListener("hashchange", route);

  loadAll().then(route).then(function(){
    if(ghToken()) syncNow().catch(function(){});
  }).catch(function(err){
    app.innerHTML = '<div class="empty">Не удалось загрузить чек-листы.<br>' + escapeHtml(String(err)) + '</div>';
    console.error(err);
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
