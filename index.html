<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Topics</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%225%22%20fill%3D%22%230f0f10%22/%3E%3Cpath%20d%3D%22M7%204h10l3.2%205L12%2020.5%203.8%209Z%22%20fill%3D%22none%22%20stroke%3D%22%23f5f5f5%22%20stroke-width%3D%221.5%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M9.5%204%207.8%209l4.2%2011.5L16.2%209%2014.5%204%22%20fill%3D%22none%22%20stroke%3D%22%23f5f5f5%22%20stroke-width%3D%221.2%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M3.8%209h16.4%22%20stroke%3D%22%23f5f5f5%22%20stroke-width%3D%221.2%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --fg:#111111;
    --muted:#6b6b6b;
    --faint:#9a9a9a;
    --border:#e7e7e7;
    --card-bg:#ffffff;
    --shadow-1:0 1px 2px rgba(0,0,0,.04), 0 1px 6px rgba(0,0,0,.05);
    --shadow-2:0 10px 30px rgba(0,0,0,.10), 0 2px 8px rgba(0,0,0,.06);
    --accent:#111111;
    --track:#eeeeee;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0b0c;
      --fg:#f3f3f3;
      --muted:#a3a3a3;
      --faint:#6f6f6f;
      --border:#232323;
      --card-bg:#131314;
      --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 1px 6px rgba(0,0,0,.3);
      --shadow-2:0 10px 30px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
      --accent:#f3f3f3;
      --track:#232323;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:760px;margin:0 auto;padding:48px 24px 96px;}

  /* ---------- header ---------- */
  header.top{text-align:center;margin-bottom:36px;}
  header.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;}

  /* ---------- home grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
  @media (max-width:640px){
    .grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:420px){
    .grid{grid-template-columns:1fr;}
  }
  /* на узких экранах langBtn уезжает под шапку (см. #langBtn media query) —
     даём сетке карточек отступ сверху, чтобы не перекрывалась */
  @media (max-width:900px){
    .grid{margin-top:44px;}
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 18px 16px;
    box-shadow:var(--shadow-1);
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    height:150px;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-4px);
    box-shadow:var(--shadow-2);
    border-color:transparent;
    outline:none;
  }
  .card h2{
    font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);}
  .card .meta .pct{font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg);}
  .bar{height:4px;border-radius:999px;background:var(--track);overflow:hidden;}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease;}

  /* ---------- floating nav buttons ---------- */
  .fab{
    position:fixed;
    width:42px;height:42px;
    border-radius:50%;
    background:var(--card-bg);
    border:1px solid var(--border);
    box-shadow:var(--shadow-1);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--fg);
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    z-index:50;
  }
  .fab:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);}
  .fab svg{width:18px;height:18px;}
  /* держим кнопки у краёв контент-блока (760px, центрирован), но не даём им уехать за экран */
  /* 380px = половина ширины .wrap (760px), 42px = ширина кнопки, 16px = зазор до контента */
  #topBtn{ right:max(16px, calc(50vw - 380px - 42px - 16px)); bottom:28px; opacity:0; pointer-events:none; }
  #topBtn.visible{opacity:1;pointer-events:auto;}
  #backBtn{ left:max(16px, calc(50vw - 380px - 42px - 16px)); top:28px; display:none; }
  #langBtn{ right:max(16px, calc(50vw - 380px - 50px - 16px)); top:28px; width:auto; padding:0 14px; font-size:12px; font-weight:700; letter-spacing:.03em; }
  /* ниже 900px кнопки по горизонтали упираются в заголовок/шапку — уводим вниз */
  @media (max-width:900px){
    #backBtn{top:92px;}
    #langBtn{top:92px;}
  }

  .site-footer{
    position:fixed;
    left:20px;bottom:20px;
    font-size:11.5px;
    color:var(--faint);
    z-index:40;
  }
  .site-footer a{transition:color .15s ease;}
  .site-footer a:hover{color:var(--fg);}

  /* ---------- detail page ---------- */
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:8px;flex-wrap:wrap;}
  .detail-head h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em;}
  .detail-progress{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;}
  .head-actions{display:flex;gap:8px;}
  .icon-btn{
    width:36px;height:36px;min-width:36px;
    border-radius:50%;
    background:none;
    border:1px solid var(--border);
    color:var(--faint);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .icon-btn:hover{color:var(--fg);border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}
  .reset-btn:hover{transform:rotate(-40deg);}
  .download-btn:hover{transform:translateY(-2px);}

  /* ---------- confirm modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:200;
    padding:24px;
    animation:fade-in .15s ease;
  }
  @keyframes fade-in{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow-2);
    padding:24px;
    max-width:320px;
    width:100%;
    text-align:center;
  }
  .modal p{margin:0 0 20px;font-size:14px;line-height:1.5;color:var(--fg);}
  .modal .modal-actions{display:flex;gap:10px;justify-content:center;}
  .modal button{
    font-family:inherit;font-size:13px;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    transition:opacity .15s ease, border-color .15s ease;
  }
  .modal .btn-cancel{background:none;border:1px solid var(--border);color:var(--fg);}
  .modal .btn-cancel:hover{border-color:var(--fg);}
  .modal .btn-confirm{background:var(--accent);border:1px solid var(--accent);color:var(--bg);}
  .modal .btn-confirm:hover{opacity:.85;}
  .bar-segments{display:flex;gap:4px;height:6px;margin:18px 0 36px;}
  .seg-group{display:flex;gap:2px;min-width:5px;}
  .bar-segments .seg{
    position:relative;height:100%;min-width:4px;
    border-radius:999px;background:var(--track);overflow:hidden;
  }
  .bar-segments .seg > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease;}
  /* бонусный кусочек полосы за ресерч-темы: та же шкала, но приглушённая заливка */
  .bar-segments .seg.seg-bonus{background:transparent;border:1px dashed var(--border);}
  .bar-segments .seg.seg-bonus > i{background:var(--accent);opacity:.45;}

  .part{
    margin-bottom:22px;
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 22px;
    background:var(--card-bg);
    box-shadow:var(--shadow-1);
  }
  .part > h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    font-weight:700;
    margin:0 0 14px;
  }
  .section{margin:18px 0 6px;}
  .section > h3{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--fg);}

  .item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:7px 2px;
    cursor:pointer;
  }
  .item input[type=checkbox]{
    appearance:none;
    -webkit-appearance:none;
    width:17px;height:17px;
    min-width:17px;
    border:1.5px solid var(--faint);
    border-radius:5px;
    display:grid;
    place-content:center;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .item input[type=checkbox]::before{
    content:"";
    width:9px;height:9px;
    transform:scale(0);
    transition:transform .12s ease;
    box-shadow:inset 1em 1em var(--bg);
    clip-path:polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 45% 62%);
  }
  .item input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);}
  .item input[type=checkbox]:checked::before{transform:scale(1);}
  .item .txt{font-size:14.5px;line-height:1.5;}
  .item .code{color:var(--faint);opacity:.65;font-variant-numeric:tabular-nums;margin-right:6px;font-size:9px;}
  .item.checked .label{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--border);}
  .item a{text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px;}
  .item a:hover{text-decoration-color:currentColor;}

  /* ресерч-темы (необязательный "углублённый" уровень): пунктирный чекбокс + бейдж R */
  .item.research input[type=checkbox]{border-style:dashed;}
  .item.research input[type=checkbox]:checked{border-style:solid;}
  .item .r-badge{
    display:inline-block;
    font-size:8.5px;font-weight:700;
    color:var(--muted);
    border:1px solid var(--border);
    border-radius:3px;
    padding:0 3px;
    margin-right:6px;
    line-height:1.4;
    vertical-align:middle;
  }

  .empty{color:var(--muted);padding:40px 0;text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "mltopics:v1";
  var state = {};
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch(e){ state = {}; }

  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  }

  // ---------------------------------------------------------------------
  // language: content lives in content/ru/*.md and content/en/*.md
  // (identical structure/order, so checkbox state carries over 1:1)
  // ---------------------------------------------------------------------
  var LANG_KEY = "mltopics:lang";
  var LANG = "ru";
  try { LANG = localStorage.getItem(LANG_KEY) || "ru"; } catch(e){ LANG = "ru"; }

  var STRINGS = {
    ru: {
      partWord: "Часть",
      back: "К категориям",
      top: "Наверх",
      download: "Скачать .md",
      reset: "Сбросить прогресс",
      cancel: "Отмена",
      confirmBtn: "Сбросить",
      resetConfirm: function(title){ return 'Сбросить прогресс по разделу «' + title + '»?'; },
      notFound: "Категория не найдена.",
      researchHint: "Необязательная тема углублённого уровня — не входит в основной %, даёт бонус сверху"
    },
    en: {
      partWord: "Part",
      back: "Back to categories",
      top: "Scroll to top",
      download: "Download .md",
      reset: "Reset progress",
      cancel: "Cancel",
      confirmBtn: "Reset",
      resetConfirm: function(title){ return "Reset progress for “" + title + "”?"; },
      notFound: "Category not found.",
      researchHint: "Optional deep-dive topic — outside the main %, counts as a bonus on top"
    }
  };
  function t(){ return STRINGS[LANG]; }

  function isChecked(catId, code, defaultChecked){
    var cat = state[catId];
    if(cat && Object.prototype.hasOwnProperty.call(cat, code)) return !!cat[code];
    return !!defaultChecked;
  }

  function setChecked(catId, code, value){
    if(!state[catId]) state[catId] = {};
    state[catId][code] = value;
    saveState();
  }

  function resetCategory(catId){
    delete state[catId];
    saveState();
  }

  function downloadText(filename, text){
    var blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function showConfirm(message, onConfirm, cancelLabel, confirmLabel){
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<p>' + escapeHtml(message) + '</p>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn-cancel">' + escapeHtml(cancelLabel || "Cancel") + '</button>' +
          '<button type="button" class="btn-confirm">' + escapeHtml(confirmLabel || "Reset") + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(backdrop);

    function close(){
      document.removeEventListener("keydown", onKey);
      backdrop.remove();
    }
    function onKey(e){ if(e.key === "Escape") close(); }
    document.addEventListener("keydown", onKey);

    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
    backdrop.querySelector(".btn-cancel").addEventListener("click", close);
    backdrop.querySelector(".btn-confirm").addEventListener("click", function(){
      close();
      onConfirm();
    });
  }

  // ---------------------------------------------------------------------
  // Minimal markdown parser tailored to our checklist format:
  //   # Title
  //   ## Part
  //   ### Section
  //   - [ ] CODE text   (checkbox item, code = leading "1.1" / "I.1.1" token)
  // ---------------------------------------------------------------------
  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function inlineMd(text){
    var html = escapeHtml(text);
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function(_, label, url){
      return '<a href="' + url + '" target="_blank" rel="noopener">' + label + '</a>';
    });
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    return html;
  }

  // Коды (I, I.1, I.1.1, ...) нигде не пишутся руками в .md — их всегда
  // выводит рендер из порядка заголовков/пунктов в файле. Так порядок можно
  // менять местами, ничего не пересчитывая.
  function toRoman(num){
    var map = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],
               [50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
    var out = "";
    map.forEach(function(pair){
      while(num >= pair[0]){ out += pair[1]; num -= pair[0]; }
    });
    return out || String(num);
  }

  function parseMarkdown(src, catId){
    var lines = src.split(/\r?\n/);
    var title = catId;
    var parts = [];
    var curPart = null, curSection = null;
    var items = [];
    var partN = 0;

    function ensurePart(){
      if(!curPart){
        partN++;
        curPart = { title:"", code: toRoman(partN), childN: 0, entries: [] };
        parts.push(curPart);
      }
    }

    lines.forEach(function(line){
      var l = line.trim();
      if(!l) return;

      var m;
      if((m = /^#\s+(.*)$/.exec(l))){
        title = m[1].trim();
      } else if((m = /^##\s+(.*)$/.exec(l))){
        partN++;
        curPart = { title: m[1].trim(), code: toRoman(partN), childN: 0, entries: [] };
        curSection = null;
        parts.push(curPart);
      } else if((m = /^###\s+(.*)$/.exec(l))){
        ensurePart();
        curPart.childN++;
        var sectionCode = curPart.code + "." + curPart.childN;
        curSection = { title: m[1].trim(), code: sectionCode, autoN: 0, items: [] };
        curPart.entries.push({ type:"section", section: curSection });
      } else if((m = /^-\s+\[( |x|X)\](\{r\})?\s+(.*)$/i.exec(l))){
        var defaultChecked = m[1].toLowerCase() === "x";
        var isResearch = !!m[2];
        var text = m[3].trim();
        var code;
        if(curSection){
          curSection.autoN++;
          code = curSection.code + "." + curSection.autoN;
        } else {
          ensurePart();
          curPart.childN++;
          code = curPart.code + "." + curPart.childN;
        }
        var item = { code: code, text: text, defaultChecked: defaultChecked, research: isResearch };
        items.push(item);
        if(curSection){ curSection.items.push(item); }
        else { curPart.entries.push({ type:"item", item: item }); }
      }
    });

    return { id: catId, title: title, parts: parts, items: items };
  }

  // ---------------------------------------------------------------------
  // data loading
  // ---------------------------------------------------------------------
  var CATALOG = {};
  var ORDER = [];
  var MANIFEST = null;

  function loadAll(){
    var manifestPromise = MANIFEST
      ? Promise.resolve(MANIFEST)
      : fetch("content/manifest.json").then(function(r){
          if(!r.ok) throw new Error("manifest fetch failed: " + r.status);
          return r.json();
        }).then(function(m){ MANIFEST = m; return m; });

    return manifestPromise.then(function(manifest){
      ORDER = manifest.map(function(m){ return m.id; });
      return Promise.all(manifest.map(function(entry){
        return fetch("content/" + LANG + "/" + entry.file).then(function(r){
          if(!r.ok) throw new Error("fetch failed: " + entry.file);
          return r.text();
        }).then(function(text){
          var parsed = parseMarkdown(text, entry.id);
          var localTitle = LANG === "en" ? (entry.title_en || entry.title) : entry.title;
          if(localTitle) parsed.title = localTitle;
          parsed.raw = text;
          parsed.file = entry.file;
          CATALOG[entry.id] = parsed;
        });
      }));
    });
  }

  // Темы с тегом {r} — необязательный "ресерч"-уровень: не входят в
  // знаменатель процента, но если пройдены — дают бонус сверху (общий %
  // курса может уйти выше 100).
  function splitItems(items){
    var normal = [], research = [];
    items.forEach(function(it){ (it.research ? research : normal).push(it); });
    return { normal: normal, research: research };
  }

  function computeProgress(catId, items){
    var s = splitItems(items);
    var doneNormal = 0, doneResearch = 0;
    s.normal.forEach(function(it){ if(isChecked(catId, it.code, it.defaultChecked)) doneNormal++; });
    s.research.forEach(function(it){ if(isChecked(catId, it.code, it.defaultChecked)) doneResearch++; });
    var total = s.normal.length;
    // pct — чистый % обычных тем (0-100, ведёт ширину основного бара).
    // totalPct — с бонусом за ресерч сверху, может уйти выше 100 (для текста).
    var pct = total ? Math.round(doneNormal / total * 100) : 0;
    var totalPct = total ? Math.round((doneNormal + doneResearch) / total * 100) : 0;
    return {
      done: doneNormal, total: total, pct: pct, totalPct: totalPct,
      doneResearch: doneResearch, totalResearch: s.research.length,
      researchPct: s.research.length ? Math.round(doneResearch / s.research.length * 100) : 0
    };
  }

  function progressFor(catId){
    var cat = CATALOG[catId];
    if(!cat) return { done:0, total:0, pct:0, doneResearch:0, totalResearch:0, researchPct:0 };
    return computeProgress(catId, cat.items);
  }

  function partItems(part){
    var out = [];
    part.entries.forEach(function(entry){
      if(entry.type === "section") out = out.concat(entry.section.items);
      else out.push(entry.item);
    });
    return out;
  }

  function progressForItems(catId, items){
    return computeProgress(catId, items);
  }

  // ---------------------------------------------------------------------
  // rendering
  // ---------------------------------------------------------------------
  var app = document.getElementById("app");

  function renderHome(){
    var head = document.createElement("header");
    head.className = "top";
    head.innerHTML = '<h1>ML Topics</h1>';

    var grid = document.createElement("div");
    grid.className = "grid";

    ORDER.forEach(function(id){
      var cat = CATALOG[id];
      if(!cat) return;
      var p = progressFor(id);
      var card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      card.innerHTML =
        '<h2>' + escapeHtml(cat.title) + '</h2>' +
        '<div>' +
          '<div class="meta"><span>' + p.done + ' / ' + p.total + '</span><span class="pct">' + p.totalPct + '%</span></div>' +
          '<div class="bar"><i style="width:' + Math.min(p.pct, 100) + '%"></i></div>' +
        '</div>';
      function go(){ location.hash = "#/" + id; }
      card.addEventListener("click", go);
      card.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });
      grid.appendChild(card);
    });

    app.innerHTML = "";
    app.appendChild(head);
    app.appendChild(grid);
  }

  function renderItem(catId, item){
    var row = document.createElement("label");
    row.className = "item" + (item.research ? " research" : "");
    var checked = isChecked(catId, item.code, item.defaultChecked);
    if(checked) row.classList.add("checked");

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = checked;
    if(item.research) cb.title = t().researchHint;

    var label = document.createElement("span");
    label.className = "txt label";
    label.innerHTML = '<span class="code">' + escapeHtml(item.code) + '</span>' +
      (item.research ? '<span class="r-badge" title="' + escapeHtml(t().researchHint) + '">R</span>' : '') +
      inlineMd(item.text);

    row.appendChild(cb);
    row.appendChild(label);

    cb.addEventListener("change", function(){
      setChecked(catId, item.code, cb.checked);
      row.classList.toggle("checked", cb.checked);
      updateDetailProgress(catId);
    });

    return row;
  }

  var progressEls = null;

  function updateDetailProgress(catId){
    var cat = CATALOG[catId];
    var p = progressFor(catId);
    if(!progressEls || !cat) return;
    progressEls.frac.textContent = p.done + " / " + p.total + " (" + p.totalPct + "%)";
    progressEls.segments.forEach(function(seg){
      var sp = progressForItems(catId, seg.items);
      seg.fill.style.width = Math.min(sp.pct, 100) + "%";
      if(seg.bonusFill) seg.bonusFill.style.width = sp.researchPct + "%";
    });
  }

  function renderDetail(catId){
    var cat = CATALOG[catId];
    if(!cat){
      app.innerHTML = '<a class="back" href="#/">&larr; ' + escapeHtml(t().back) + '</a><div class="empty">' + escapeHtml(t().notFound) + '</div>';
      return;
    }

    app.innerHTML = "";

    var head = document.createElement("div");
    head.className = "detail-head";
    var p = progressFor(catId);
    head.innerHTML =
      '<div><h1>' + escapeHtml(cat.title) + '</h1>' +
      '<div class="detail-progress"><span id="frac">' + p.done + ' / ' + p.total + ' (' + p.totalPct + '%)</span></div></div>' +
      '<div class="head-actions">' +
        '<button class="icon-btn download-btn" type="button" aria-label="' + escapeHtml(t().download) + '" title="' + escapeHtml(t().download) + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M4 19h16"/></svg>' +
        '</button>' +
        '<button class="icon-btn reset-btn" type="button" aria-label="' + escapeHtml(t().reset) + '" title="' + escapeHtml(t().reset) + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>' +
        '</button>' +
      '</div>';
    app.appendChild(head);

    var bar = document.createElement("div");
    bar.className = "bar-segments";
    var segments = [];
    cat.parts.forEach(function(part){
      var items = partItems(part);
      if(!items.length) return;
      var sp = progressForItems(catId, items);

      var group = document.createElement("div");
      group.className = "seg-group";
      group.style.flex = (sp.total + sp.totalResearch) + " 1 0";

      var seg = document.createElement("div");
      seg.className = "seg";
      seg.style.flex = sp.total + " 1 0";
      seg.title = (part.title || cat.title) + ": " + sp.done + " / " + sp.total +
        (sp.totalResearch ? " (+" + sp.doneResearch + "/" + sp.totalResearch + " R)" : "");
      var fill = document.createElement("i");
      fill.style.width = Math.min(sp.pct, 100) + "%";
      seg.appendChild(fill);
      group.appendChild(seg);

      var bonusFill = null;
      if(sp.totalResearch){
        var bonusSeg = document.createElement("div");
        bonusSeg.className = "seg seg-bonus";
        bonusSeg.style.flex = sp.totalResearch + " 1 0";
        bonusSeg.title = seg.title;
        bonusFill = document.createElement("i");
        bonusFill.style.width = sp.researchPct + "%";
        bonusSeg.appendChild(bonusFill);
        group.appendChild(bonusSeg);
      }

      bar.appendChild(group);
      segments.push({ items: items, fill: fill, bonusFill: bonusFill });
    });
    app.appendChild(bar);

    progressEls = { frac: head.querySelector("#frac"), segments: segments };

    head.querySelector(".download-btn").addEventListener("click", function(){
      downloadText(cat.file || (catId + ".md"), cat.raw || "");
    });

    head.querySelector(".reset-btn").addEventListener("click", function(){
      showConfirm(t().resetConfirm(cat.title), function(){
        resetCategory(catId);
        renderDetail(catId);
      }, t().cancel, t().confirmBtn);
    });

    cat.parts.forEach(function(part){
      var partEl = document.createElement("div");
      partEl.className = "part";
      if(part.title){
        var h2 = document.createElement("h2");
        h2.textContent = t().partWord + " " + part.code + ". " + part.title;
        partEl.appendChild(h2);
      }
      part.entries.forEach(function(entry){
        if(entry.type === "section"){
          var secEl = document.createElement("div");
          secEl.className = "section";
          var h3 = document.createElement("h3");
          h3.textContent = entry.section.code + " " + entry.section.title;
          secEl.appendChild(h3);
          entry.section.items.forEach(function(item){
            secEl.appendChild(renderItem(catId, item));
          });
          partEl.appendChild(secEl);
        } else {
          partEl.appendChild(renderItem(catId, entry.item));
        }
      });
      app.appendChild(partEl);
    });
  }

  // ---------------------------------------------------------------------
  // floating nav buttons (back / scroll-to-top)
  // ---------------------------------------------------------------------
  var ICON_LEFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
  var ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>';

  var backBtn = document.createElement("button");
  backBtn.id = "backBtn";
  backBtn.className = "fab";
  backBtn.type = "button";
  backBtn.innerHTML = ICON_LEFT;
  backBtn.addEventListener("click", function(){ location.hash = "#/"; });
  document.body.appendChild(backBtn);

  var topBtn = document.createElement("button");
  topBtn.id = "topBtn";
  topBtn.className = "fab";
  topBtn.type = "button";
  topBtn.innerHTML = ICON_UP;
  topBtn.addEventListener("click", function(){ window.scrollTo({ top:0, behavior:"smooth" }); });
  document.body.appendChild(topBtn);

  window.addEventListener("scroll", function(){
    topBtn.classList.toggle("visible", window.scrollY > 400);
  });

  var langBtn = document.createElement("button");
  langBtn.id = "langBtn";
  langBtn.className = "fab lang-btn";
  langBtn.type = "button";
  document.body.appendChild(langBtn);

  function refreshChrome(){
    backBtn.setAttribute("aria-label", t().back);
    backBtn.title = t().back;
    topBtn.setAttribute("aria-label", t().top);
    topBtn.title = t().top;
    langBtn.textContent = LANG === "ru" ? "EN" : "RU";
    langBtn.setAttribute("aria-label", LANG === "ru" ? "Switch to English" : "Переключить на русский");
    document.documentElement.lang = LANG;
  }
  refreshChrome();

  langBtn.addEventListener("click", function(){
    LANG = LANG === "ru" ? "en" : "ru";
    try { localStorage.setItem(LANG_KEY, LANG); } catch(e){}
    refreshChrome();
    var scrollY = window.scrollY;
    loadAll().then(function(){
      route();
      window.scrollTo(0, scrollY);
    });
  });

  var footer = document.createElement("div");
  footer.className = "site-footer";
  footer.innerHTML = '<a href="https://github.com/qubeyond" target="_blank" rel="noopener">github.com/qubeyond</a>';
  document.body.appendChild(footer);

  // ---------------------------------------------------------------------
  // router
  // ---------------------------------------------------------------------
  function route(){
    var hash = location.hash.replace(/^#\/?/, "");
    backBtn.style.display = hash ? "flex" : "none";
    if(!hash){ renderHome(); return; }
    renderDetail(hash);
  }

  window.addEventListener("hashchange", route);

  loadAll().then(route).catch(function(err){
    app.innerHTML = '<div class="empty">Не удалось загрузить чек-листы.<br>' + escapeHtml(String(err)) + '</div>';
    console.error(err);
  });
})();
</script>
</body>
</html>
